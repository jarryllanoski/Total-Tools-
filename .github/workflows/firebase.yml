name: Publicar en Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      servidor:
        description: Publicar tambien el servidor (functions)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Que cambio
        id: cambios
        env:
          EVENTO: ${{ github.event_name }}
          MANUAL: ${{ inputs.servidor }}
          ANTES: ${{ github.event.before }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            servidor="$MANUAL"
          elif ! git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            servidor=true
          elif git diff --quiet "$ANTES" HEAD -- functions; then
            servidor=false
          else
            servidor=true
          fi
          echo "servidor=$servidor" >> "$GITHUB_OUTPUT"
          echo "Servidor: $servidor"
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Pruebas
        run: node tests/correr.js
      - name: Identidad sin claves (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/256086864182/locations/global/workloadIdentityPools/github/providers/total-tools
          service_account: github-action-1237310279@total-tools-24ce8.iam.gserviceaccount.com
      - name: Firebase CLI
        run: npm install -g firebase-tools@15.36.0
      - name: Publicar la web
        run: firebase deploy --only hosting --project total-tools-24ce8 --non-interactive
      - name: Dependencias del servidor
        if: steps.cambios.outputs.servidor == 'true'
        working-directory: functions
        run: npm ci
      - name: Publicar el servidor
        if: steps.cambios.outputs.servidor == 'true'
        run: firebase deploy --only functions --project total-tools-24ce8 --non-interactive
