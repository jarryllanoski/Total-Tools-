(function(){
'use strict';

/* ─── GLOBAL STATE ──────────────────────────────────────────────── */
let selCourierName = '';
let selCourierType = '';
let selDateIso     = '';
let selDateLbl     = '';
// ★ Exponer selDate globalmente desde el inicio para evitar ReferenceError
window.selDate = function(iso, lbl) {

/* ─── INIT ──────────────────────────────────────────────────────────
   ⚠️ Se DECLARA aquí y se LLAMA al final del script (30/10/2026). Antes
   corría en este punto, cuando aún no existían los `let`/`const` de más
   abajo: así nació el «Iniciando fábrica…» colgado (TDZ). Llamarla al
   final cierra esa familia de fallos entera, no solo el caso que se vio. */
function init(){
  /* El seguimiento (?seg=) ya se redirigió a seguimiento.html en el <head>. */

  /* Link de registro con token de prefill (?t=TOKEN) */
  const tok = new URLSearchParams(location.search).get('t') || '';
  if(tok){ checkToken(tok); return; }

  /* Fallback: localStorage (último pedido en este dispositivo) */
  const saved = localStorage.getItem('dpanel_order_'+wsId);
  if(saved){
    try{
      const o = JSON.parse(saved);
      if(o.trackToken){ location.replace('seguimiento.html?seg=' + encodeURIComponent(o.trackToken)); return; }
    }catch(e){}
  }

  loadCfg();
}

/* ─── TOKEN CHECK (link de registro) ─────────────────────────────── */
async function checkToken(tok){
  setApp(`<div class="loading-screen"><div class="spin"></div><div class="spin-lbl">Verificando link...</div></div>`);
  try{
    const timeoutP = new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),8000));
    const data = await Promise.race([_api('token', {t: tok}), timeoutP]);
    if(data.status === 'expired'){
      showTokenScreen('⏰','Link vencido','Este link ya venció. Solicitá uno nuevo.');
      return;
    }
    if(data.status === 'used'){
      showTokenScreen('🔒','Link ya utilizado','Este link ya fue utilizado.\nPara registrar un nuevo pedido, solicitá un nuevo link.');
      return;
    }
    if(data.status === 'invalid'){
      showTokenScreen('❌','Link inválido','Este link no existe o fue eliminado.');
      return;
    }
    /* Válido — mostrar form con prefill */
    currentToken = tok;
    if(data.prefillName)  _prefillName  = data.prefillName;
    if(data.prefillPhone) _prefillPhone = data.prefillPhone;
    if(data.prefillLink)  _prefillLink  = data.prefillLink;
    /* La foto de configuración de ESTE link, tal como la guardó el panel en
       el token. Manda sobre la de la URL: la URL la puede editar el cliente,
       el token no. Los tokens viejos no la traen y se sigue con la URL. */
    if(data.cfgId) _tokCfgId = String(data.cfgId);
    loadCfg();
  }catch(e){
    if(e.message==='timeout'){
      showTokenScreen('⚠️','Sin conexión','No se pudo verificar el link.\nRevisa tu conexión e intenta de nuevo.');
    } else {
      showTokenScreen('⚠️','Error de conexión','Reintentá más tarde.');
    }
  }
}

function showTokenScreen(icon, title, msg){
  setApp(`<div class="unconf">
    <div class="unconf-icon">${icon}</div>
    <div class="unconf-ttl">${esc(title)}</div>
    <div class="unconf-sub">${esc(msg).replace(/\n/g,'<br>')}</div>
  </div>`);
  if(window.TTFormLoader) TTFormLoader.ready(); // pantalla final de link → ocultar loader
}

/* El id de la foto que trae el TOKEN. Vacío si el link es viejo o no hay
   token: entonces se usa el de la URL, como siempre. */
var _tokCfgId = '';

async function loadCfg(){
  CFG = null;
  renderForm();
  try{
    const cfgId = _tokCfgId || new URLSearchParams(location.search).get('cfg');
    const withTO = (pr,ms)=>Promise.race([pr, new Promise(r=>setTimeout(()=>r(null),ms))]);
    let cfg = null;
    if(cfgId){
      const snap = await withTO(_api('formcfg', {id: cfgId}), 5000);
      if(snap && !snap.error) cfg = snap;
    }
    // Sin snapshot, snapshot fallido, o snapshot sin teléfono del negocio →
    // completar con la config en vivo. Garantiza el botón de WhatsApp.
    if(!cfg || !_cfgHasPhone(cfg)){
      const live = await withTO(_api('config'), 5000);
      if(live && !live.error){
        if(!cfg){ cfg = live; }
        else{
          const lp = live.phone || (live.config && live.config.phone) || '';
          if(lp) cfg.phone = lp;
          if(!(cfg.name||(cfg.config&&cfg.config.name))) cfg.name = live.name || (live.config&&live.config.name) || '';
        }
      }
    }
    if(cfg && !cfg.error){ CFG = cfg; renderForm(); }
  }catch(e){
    console.warn('Config no disponible:', e.message);
  }finally{
    // Config resuelta (o timeout) y form renderizado → recién ahora ocultar el
    // loader, cubriendo el doble-render por debajo (sin flash ni spinner básico).
    if(window.TTFormLoader) TTFormLoader.ready();
  }
}

/* Lo que dice Toby y los pasos, según el estado. PURA: se prueba sola. */
function _ayudaFormContenido(e){
  e=e||{};
  var tipo=e.tipo||'', paso=e.paso||1, retiro=tipo==='retiro';
  var dest={
    agencia: e.mapa
      ? 'Toca el botón azul de <b>ubicación</b> o busca tu <b>provincia o distrito</b> con la 🔍 lupa. Luego elige tu sede en la lista o tocando su <b>pin rojo</b>: queda marcada con ✓.'
      : 'Escribe tu ciudad o distrito y toca la sede donde recogerás.',
    delivery: 'Escribe tu dirección de entrega o toca <b>📍 Usar mi ubicación</b> para que el motorizado llegue exacto. Agrega una referencia.',
    encomienda: 'Escribe la <b>ciudad de destino</b> y, si la sabes, la agencia.'
  };
  var pasos=[
    {n:1, t:'Cómo recibir tu pedido', d:'Elige Shalom, delivery, otra agencia o retiro en tienda.'},
    {n:2, t:'Datos de quien recibe', d:'Escribe el <b>DNI</b>: el nombre se completa solo. Luego tu número de <b>WhatsApp</b>.'},
    {n:3, t:'Destino', d: dest[tipo] || 'La sede, tu dirección o la ciudad, según cómo lo recibas.'},
    {n:4, t:'Fecha y confirmar', d:'Elige la fecha de envío y toca <b>Confirmar pedido</b>. Tu pedido queda registrado al instante.'}
  ];
  if(retiro) pasos=pasos.filter(function(p){ return p.n!==3; });
  if(e.unico) pasos=pasos.filter(function(p){ return p.n!==1; });
  var toby;
  if(e.confirmado) toby='¡Listo! 🎉 Tu pedido <b>ya está registrado</b>. Toca <b>Ir a WhatsApp</b> para recibir tu link de seguimiento.';
  else if(paso===1) toby='¡Hola! Soy Toby 🐢, tu guía. Pedir toma menos de un minuto: primero elige <b>cómo quieres recibir</b> tu pedido.';
  else if(paso===2) toby='Empieza por el <b>DNI</b> de quien recibe: así su nombre sale exacto, sin errores en la etiqueta.';
  else if(paso===3) toby=({
    agencia: e.mapa ? 'Toca el botón azul de <b>ubicación</b> o busca tu <b>provincia o distrito</b> con la 🔍 lupa: te muestro tus sedes.' : 'Escribe tu distrito y elige la sede donde recogerás.',
    delivery: 'Con <b>📍 Usar mi ubicación</b> el motorizado llega exacto a tu puerta.',
    encomienda: 'Cuéntame a qué <b>ciudad</b> viaja tu pedido.'
  })[tipo] || 'Dime a dónde enviamos tu pedido.';
  else toby='Último paso: elige la <b>fecha</b> y toca <b>Confirmar pedido</b>.';
  var faq=[
    {q:'¿Mi pedido ya queda registrado?', a:'Sí. Al tocar «Confirmar pedido» ya nos llega. WhatsApp sirve para que recibas tu link de seguimiento y para escribirnos.'},
    {q:'¿Para qué piden el DNI?', a:'Para que solo la persona indicada pueda recoger el pedido, y para escribir su nombre tal como figura en su documento.'},
    {q:'¿Guardan mi ubicación?', a:'Para elegir sede, no: solo se usa en tu teléfono para ordenar las sedes por cercanía. En delivery se envía el punto de entrega para que el motorizado llegue.'},
    {q:'¿Cómo sigo mi pedido?', a:'Con el link que recibes por WhatsApp. Ahí ves cada estado de tu pedido.'},
    {q:'Me equivoqué en un dato', a:'Si aún no confirmas, vuelve con «← Atrás». Si ya confirmaste, escríbenos por WhatsApp y lo corregimos.'}
  ];
  if(retiro && e.tiendaDir) faq.splice(1,0,{q:'¿Dónde recojo mi pedido?', a:'En nuestra tienda: '+esc(e.tiendaDir)+'. Te avisamos cuando esté listo. Trae tu DNI.'});
  return {toby:toby, pasos:pasos, faq:faq};
}
function abrirAyudaForm(){
  const ov = _ayudaHoja();
  const seq = (typeof wzSeq==='function') ? wzSeq() : [1,2,3,4];
  const c = _ayudaFormContenido({
    tipo: selCourierType, paso: _wzStep, confirmado: !!window._ttFrozen, unico: !!_wzUnico,
    mapa: selCourierType==='agencia' && !$('agcManualInput'),
    tiendaDir: String(((CFG && (CFG.config||CFG)) || {}).city || '').trim()
  });
  const actual = seq.indexOf(_wzStep);
  const wa = _ayudaWa('Hola, necesito ayuda con mi pedido');
  ov.innerHTML = `<div class="ay-sheet">
    ${_toby((window._ttFrozen ? '' : _holaNombre(($('f_name')||{value:''}).value)) + c.toby, 'Guía de pedidos')}
    <div class="ay-ttl">Tu pedido en ${c.pasos.length} pasos</div>
    ${c.pasos.map((p,i)=>{
      const est = window._ttFrozen ? 'ok' : (i===actual ? 'on' : (i<actual ? 'ok' : ''));

    }).join('')}
    <div class="ay-ttl">Preguntas frecuentes</div>
    ${c.faq.map(f=>`<details><summary>${f.q}</summary><p>${f.a}</p></details>`).join('')}
    <div class="ay-btns">
      ${wa?`<a class="ay-wa" href="${esc(wa)}" target="_blank" rel="noopener">💬 Escríbenos</a>`:''}
      <button class="ay-x" onclick="cerrarAyudaForm()">Entendido</button>
    </div>
  </div>`;
  ov.style.display = 'flex';
  document.body.classList.add('tt-ayuda-on');
  try{ ov.querySelector('.ay-x').focus({preventScroll:true}); }catch(_){}
}

function _courierLabel(name, type){
  const u=(name||'').toUpperCase();
  if(u.includes('RETIRO')) return 'RETIRO EN TIENDA';
  if(_isOtrasAg(u)) return 'OTRA AGENCIA';
  return name;
}

// Emoji representativo según el courier (íconos sin imágenes externas)
function _courierIcon(name, type){
  const u=(name||'').toUpperCase();
  if(u.includes('RETIRO')) return '🏪';
  if(_isOtrasAg(u)) return '📦';
  if(u.includes('DELIVERY')) return '🏍️';
  if(u.includes('SHALOM')) return '🚚';
  if(u.includes('OLVA')) return '🚚';
  if(u.includes('MARVISUR')) return '🚚';
  if(u.includes('DINSIDES')) return '🚚';
  return (type==='agencia') ? '🏢' : '🚚';
}

function renderForm(){
  // Datos del negocio para la etiqueta viva (REMITENTE). Se lee del mismo CFG.
  window._bizInfo = {
    name:  (CFG&&(CFG.name||CFG.config&&CFG.config.name))||'Mi Negocio',
    phone: ((CFG&&(CFG.config&&CFG.config.phone||CFG.phone))||'').toString().trim(),
    city:  (CFG&&(CFG.city||CFG.config&&CFG.config.city))||''
  };
  _knownClient=null; _gpsLat=null; _gpsLon=null;
  const extraF   = ((CFG&&CFG.extraFields)||[]).filter(f=>f&&f.visible!==false);
  // Couriers: usar config de Firebase o defaults de tu app
  const couriers = (CFG&&CFG.couriers)||['SHALOM','OLVA COURIER','MARVISUR','DELIVERY','RETIRO EN TIENDA','OTRAS AGENCIAS'];
  const cAct     = (CFG&&CFG.courierActive)||{};
  const cTypes   = (CFG&&CFG.courierTypes)||{};
  const dispatch = (CFG&&CFG.dispatch)||{};
  const active   = couriers.filter(c=>cAct[c]!==false);
  // Orden por prioridad para el cliente (solo presentación; no toca lógica).
  const _prio=(c)=>{ const u=(c||'').toUpperCase();
    if(u.includes('SHALOM'))    return 1;
    if(u.includes('DELIVERY'))  return 2;
    if(u.includes('OLVA'))      return 3;
    if(u.includes('MARVISUR'))  return 4;
    if(_isOtrasAg(u))           return 5;   // Otras Agencias
    if(u.includes('RETIRO'))    return 6;
    if(u.includes('DINSIDES'))  return 7;
    return 50; };
  active.sort((a,b)=>_prio(a)-_prio(b));
  _wzUnico = active.length===1 ? active[0] : '';

  const extraHtml = extraF.map(f=>{
    const fname=typeof f==='string'?f:(f.name||'');
    const isReq=typeof f==='object'&&!!f.required;
    const eid='ex_'+fname.replace(/\W/g,'_');
    return `<div class="fg">
      <input class="fi" id="${esc(eid)}" data-extra="${esc(fname)}" data-req="${isReq?'1':'0'}"
        placeholder="${esc(fname)}${isReq?' *':''}" autocomplete="off">
      ${isReq?`<div class="ferr" id="exerr_${esc(fname.replace(/\W/g,'_'))}">Este campo es obligatorio</div>`:''}
    </div>`;
  }).join('');

  const courierOpts = active.length
    ? '<option value="">— ¿Cómo quieres recibir? —</option>'+active.map(c=>{
        const t=cTypes[c]||'delivery';
        return `<option value="${esc(c)}">${esc(_courierLabel(c,t))}</option>`;
      }).join('')
    : '<option value="">Sin couriers configurados</option>';

  // Tarjetas de courier VISIBLES (el cliente elige de un vistazo). El <select>
  // #f_courier queda oculto como fuente de la verdad: las tarjetas solo lo
  // escriben y disparan 'change' → misma lógica de siempre.
  const _courierTypeOf=(c)=>{
    const u=(c||'').toUpperCase();
    if(_isOtrasAg(u)) return 'encomienda';
    if(u.includes('RETIRO')) return 'retiro';
    if(cTypes[c]==='agencia'||['SHALOM','OLVA','MARVISUR','DINSIDES'].some(n=>u.includes(n))) return 'agencia';
    return 'delivery';
  };
  const courierCards = active.length
    ? active.map(c=>{
        const t=_courierTypeOf(c);
        return `<button type="button" class="cour-card" role="radio" aria-checked="false" data-courier="${esc(c)}" onclick="pickCourier(this.dataset.courier)">
          <span class="cc-ic">${_courierSvg(t)}</span>
          <span class="cc-body"><span class="cc-name">${esc(_courierLabel(c,t))}</span></span>
          <span class="cc-radio"></span>
        </button>`;
      }).join('')
    : `<div class="ferr show" style="position:static">Sin couriers configurados</div>`;

  const datesChips=buildDatesChips(dispatch);

  setApp(`
    ${headerHtml()}
    <div class="wz-wrap">
      <div id="wzProgress" class="wz-progress"></div>
      <!-- ★ ELEGIR CÓMO RECIBIR ES LO PRIMERO — 15/10/2026.
           Lo pidió el dueño mirando su pantalla: al entrar se veía una
           etiqueta EN BLANCO ocupando el primer tercio del móvil, y debajo
           tres campos. La etiqueta en blanco no dice nada; elegir cómo
           quieres recibir el pedido sí, y además es la decisión de la que
           cuelga todo lo demás —qué se pregunta en el paso 3, y si hay
           paso 3 siquiera—.

           ⚠️ SE INTERCAMBIÓ EL CONTENIDO, NO LA NUMERACIÓN. Los pasos se
           mueven por data-step, y wzSeq() devuelve [1,2,3,4] o [1,2,4]
           según el courier. Renumerar habría tocado la secuencia, la barra,

           (Y sin comillas invertidas aquí dentro: este comentario vive
           DENTRO de un template literal de JavaScript, así que una sola
           comilla invertida cierra la cadena y revienta el archivo entero.

/* ─── NORMALIZACIÓN DE TELÉFONO (misma regla del panel) ──────────────
   Borra no-dígitos, quita el prefijo Perú (+51) si sobra y corta a 9. Se aplica
   por delegación a cualquier input con clase "phone-norm" (aquí: f_phone). Corre
   en captura, ANTES del oninput inline, así onPhoneInput recibe el valor ya
   limpio y pegar "+51 984..." deja de romper la validación de 9 dígitos. */
function normPeruPhone(s){
  var v=String(s==null?'':s).replace(/\D/g,'');
  if(v.startsWith('51')&&v.length>9) v=v.slice(2);
  return v.slice(0,9);
}

/* Contador vivo de Notas. Tope 600 = mismo límite que el servidor (formApi),
   así el cliente NUNCA envía algo que el servidor recorte en silencio. */
var NOTES_MAX=600;
function _notesCount(){
  var t=document.getElementById('f_notes'); var c=document.getElementById('f_notes_count');
  if(!t||!c) return;
  var n=t.value.length;
  c.textContent=n+' / '+NOTES_MAX;
  c.style.color=(n>=NOTES_MAX)?'#f59e0b':(n>=NOTES_MAX*0.9?'#e3b341':'var(--muted,#8b949e)');
}

(function(){
  function _norm(el){ if(el && el.classList && el.classList.contains('phone-norm')) el.value=normPeruPhone(el.value); }
  document.addEventListener('input', function(e){ _norm(e.target); }, true);
  document.addEventListener('paste', function(e){ var el=e.target; if(el&&el.classList&&el.classList.contains('phone-norm')) setTimeout(function(){ _norm(el); },0); }, true);
})();

/* ─── PHONE DETECTION ────────────────────────────────────────────── */
function onPhoneInput(val){
  clearTimeout(_phoneTimer);
  const phone=val.replace(/\D/g,'');
  if(phone.length!==9){
    _knownClient=null;
    const b=$('knownBadge'); if(b) b.style.display='none';
    return;
  }
  _phoneTimer=setTimeout(async ()=>{
    try{
      /* El link va con el celular: solo si el link personalizado es de ESE
         número el servidor devuelve nombre completo y dirección. Si no,
         solo el primer nombre (sin fuga de datos por celular). */
      const c = await _api('client', currentToken ? {phone: phone, t: currentToken} : {phone: phone});
      if(c && c.name){
        _knownClient = c;
        _showKnownBadge();
      } else {
        _knownClient=null;
        const b=$('knownBadge'); if(b) b.style.display='none';
      }
    }catch(e){
      _knownClient=null;
      const b=$('knownBadge'); if(b) b.style.display='none';
    }
  },500);
}

/* ★ EL DNI RELLENA EL NOMBRE — 15/10/2026.
   Lo pidio el dueño, y para el negocio es claro: un nombre escrito a mano
   llega con faltas, sin tildes o con el apellido delante, y eso es justo lo
   que Shalom rechaza al registrar el envio.

   Automatico y no con un boton: el dueño lo pidio asi («al poner dni
   consulte reniec»), y un boton mas es una cosa mas que explicar en una
   pantalla que ya tiene cuatro pasos.

   ⚠️ LO QUE ESCRIBIO EL CLIENTE NO SE PISA. Se rellena si el campo esta
   vacio, o si lo que hay lo puso una consulta anterior. Si el cliente
   corrigio su nombre a mano —se llama distinto a lo que dice su documento,
   o usa su nombre de siempre— eso es SUYO y manda. Un formulario que
   deshace lo que acabas de escribir es un formulario del que te vas.

   ⚠️ Y SI EL DNI CAMBIA, EL NOMBRE AUTOMATICO SE BORRA. Un nombre pegado a
   otro documento es el nombre de otra persona, y de ahi sale una etiqueta
   con el DNI de uno y el nombre de otro — que ya paso una vez en el panel,
   por otro camino. */
var _dniTimer=null, _dniPuesto='', _dniOficial='';

/* Comparar nombres como los escribe la gente: sin tildes, sin dobles
   espacios y sin importar mayusculas. «Jose  Lino» y «JOSÉ LINO» son la
   misma persona, y marcarlas como distintas seria dar un aviso de
   discrepancia donde no hay ninguna — el aviso que se da de mas es el que
   nadie lee cuando de verdad importa. */
function _nrmNom(x){
  return String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/\s+/g,' ').trim().toUpperCase();
}
/* ¿Lo escrito es una versión corta del nombre oficial? («Jarlyn Llanos»
   frente a «JARLYN LLANOS ARTEAGA»): todas sus palabras están en el DNI. */
function _nomParecido(escrito, oficial){
  var a=_nrmNom(escrito).split(' ').filter(Boolean), b=_nrmNom(oficial).split(' ');
  return a.length>0 && a.every(function(p){ return b.indexOf(p)>=0; });
}
/* ★ EL NOMBRE EMPIEZA CON LETRA (30/10/2026). Números o símbolos AL INICIO
   se quitan mientras escribe (o al pegar «123Juan» → «Juan»); después de la
   primera letra se permite lo demás. Para seguir: al menos 2 letras. */
var _NOM_LETRA=/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/;
function _nombreValido(n){
  var t=String(n||'').trim();
  return !!t && _NOM_LETRA.test(t.charAt(0)) && (t.match(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/g)||[]).length>=2;
}
function onNombreInput(el){
  if(!el) return;
  clearInterval(_dniEscribir._t);          // escribe el cliente: manda él
  var v=el.value, limpio=v.replace(/^[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+/,'');
  if(limpio!==v){
    var pos=Math.max(0,(el.selectionStart||0)-(v.length-limpio.length));
    el.value=limpio;
    try{ el.setSelectionRange(pos,pos); }catch(e){}
  }
  _dniMarca();
}

/* ★ LA MARCA DEL NOMBRE — se recalcula, nunca se recuerda (30/10/2026).
     · coincide → el campo se ilumina en verde con su ✓ y «✓ Nombre según tu
       DNI» (sin repetir el nombre: está en su campo);
     · NO coincide → una SUGERENCIA, no una alarma: el nombre del DNI y un
       botón grande para usarlo; mantener el propio es un enlace pequeño
       (lo correcto es lo más fácil). Si se parece, «Completa tu nombre»;
     · eligió mantener el suyo → una línea discreta, por si cambia de idea. */
var _dniMantener='';
function _dniMarca(){
  var el=$('dniMarca'); if(!el) return;
  var nmEl=$('f_name'), nom=(nmEl||{value:''}).value;
  var igual=!!_dniOficial && !!nom.trim() && _nrmNom(nom)===_nrmNom(_dniOficial);
  if(nmEl) nmEl.classList.toggle('nom-ok', igual);
  if(!_dniOficial || !nom.trim()){ el.style.display='none'; el.innerHTML=''; return; }
  el.style.display='block';
  if(igual){ el.innerHTML='<span class="dni-ok">✓ Nombre según tu DNI</span>'; return; }
  if(_dniMantener && _nrmNom(_dniMantener)===_nrmNom(nom)){
    el.innerHTML='<span class="dni-mant">Tu DNI dice <b>'+esc(_dniOficial)+'</b> · '
      +'<button type="button" class="dni-link" onclick="usarNombreDni()">usar el del DNI</button></span>';
    return;
  }
  var parecido=_nomParecido(nom, _dniOficial);
  el.innerHTML='<div class="dni-sug">'
    +'<div class="dni-sug-t">🪪 '+(parecido?'Completa tu nombre como en tu DNI:':'Según tu DNI:')+'</div>'
    +'<div class="dni-sug-n">'+esc(_dniOficial)+'</div>'
    +'<button type="button" class="dni-sug-si" onclick="usarNombreDni()">✓ Usar el nombre del DNI</button>'
    +'<button type="button" class="dni-link" onclick="dniMantener()">Mantener «'+esc(nom.trim().slice(0,30))+'»</button>'
    +'<div class="dni-sug-p">Así coincide con tu DNI al recoger o recibir tu pedido.</div></div>';
}
function dniMantener(){ _dniMantener=($('f_name')||{value:''}).value; _dniMarca(); }
function usarNombreDni(){
  if(!_dniOficial) return;
  var nm=$('f_name'); if(!nm) return;
  _dniPuesto=_dniOficial; _dniMantener='';
  var e=$('err_name'); if(e) e.classList.remove('show');
  nm.classList.remove('err');
  _dniEscribir(nm, _dniOficial);
}
/* El nombre «aparece» letra por letra (≈0,4 s), el campo se ilumina y suena
   el ding. Con «reducir movimiento», de golpe. */
function _dniEscribir(nm, texto){
  clearInterval(_dniEscribir._t);
  var fin=function(){
    nm.value=texto;
    nm.classList.remove('nom-brilla'); void nm.offsetWidth; nm.classList.add('nom-brilla');
    _dniMarca(); _dniDing();
  };
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){ fin(); return; }
  var i=0, paso=Math.max(1, Math.ceil(texto.length/14));
  nm.value='';
  _dniEscribir._t=setInterval(function(){
    i+=paso; nm.value=texto.slice(0,i);
    if(i>=texto.length){ clearInterval(_dniEscribir._t); _dniEscribir._t=0; fin(); }
  }, 28);
}
/* «Ding»: dos notas suaves (<0,2 s) hechas por el navegador (sin descargar
   nada). UNA vez por DNI, nunca con la página en segundo plano. */
var _dniDingHecho='';
function _dniDing(){
  try{
    var dni=($('f_dni')||{value:''}).value.replace(/\D/g,'');
    if(_dniDingHecho===dni || document.hidden) return;
    _dniDingHecho=dni;
    if(navigator.vibrate) navigator.vibrate(12);
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    var a=_dniDing._c||(_dniDing._c=new C());
    if(a.state==='suspended') a.resume();
    var t=a.currentTime;
    [[880,0],[1318.5,0.09]].forEach(function(n){
      var o=a.createOscillator(), g=a.createGain();
      o.type='sine'; o.frequency.value=n[0];
      g.gain.setValueAtTime(0.0001, t+n[1]);
      g.gain.exponentialRampToValueAtTime(0.06, t+n[1]+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t+n[1]+0.12);
      o.connect(g); g.connect(a.destination); o.start(t+n[1]); o.stop(t+n[1]+0.14);
    });
  }catch(e){}
}

/* ★ REINTENTAR CON CABEZA (30/10/2026). Una falla TEMPORAL (Shalom lento,
   App Check que no llegó, «demasiadas») ya no es «No encontramos ese DNI»:
   se reintenta solo hasta 2 veces (~1,2 s y ~2,5 s, con algo de azar para no
   chocar con otros). «No encontrado», el tope diario o un DNI inválido no se
   insisten. Si el cliente cambia el DNI a mitad, se abandona. Mismo criterio
   de «temporal» que el servidor (functions/reniecPublico.js). */
var _DNI_TEMPORAL=/^(SIN_RED|ERROR_SHALOM|FORMATO_DESCONOCIDO|SIN_RESPUESTA|LIMITE|MUCHAS_CONSULTAS|SIN_APPCHECK)$/;
async function _dniConsultar(dni, alReintentar){
  var esperas=[0, 1200, 2500], r=null;
  for(var i=0;i<esperas.length;i++){
    if(i){ alReintentar(i+1, esperas.length); await new Promise(function(z){ setTimeout(z, esperas[i]+Math.random()*400); }); }
    if(($('f_dni')||{value:''}).value.replace(/\D/g,'')!==dni) return null;   // cambió el DNI: se abandona
    try{ r=await _api('reniec', {dni: dni}); }catch(e){ r={ok:false, motivo:'SIN_RED'}; }
    if(r && r.ok) return r;
    if(!_DNI_TEMPORAL.test(String((r && r.motivo) || 'SIN_RED'))) return r;   // no se insiste
  }
  return r;
}
/* Mensaje según la CAUSA, con [Reintentar] cuando tiene sentido. */
function _dniMensajeFalla(motivo){
  var re=' <button type="button" class="dni-link dni-reintentar" onclick="dniReintentar()">Reintentar</button>';
  if(motivo==='NO_ENCONTRADO') return '<span class="dni-nada">No encontramos ese DNI. Revisa los 8 dígitos o escribe tu nombre completo.'+re+'</span>';
  if(motivo==='TOPE_DIA')      return '<span class="dni-nada">Escribe tu nombre completo como figura en tu documento.</span>';
  if(motivo==='DNI_NO_VALIDO') return '<span class="dni-nada">El DNI son 8 números.</span>';
  return '<span class="dni-nada">No pudimos consultar RENIEC ahora.'+re+' o escribe tu nombre completo.</span>';
}
function dniReintentar(){ var d=$('f_dni'); if(d) onDniInput(d.value); }

/* ★ EL DNI RELLENA EL NOMBRE — 15/10/2026 (animado el 30/10/2026).
   ⚠️ LO QUE ESCRIBIO EL CLIENTE NO SE PISA: se rellena solo si el campo
   esta vacio; si hay algo distinto, se SUGIERE (ver _dniMarca).
   ⚠️ Y SI EL DNI CAMBIA, EL NOMBRE AUTOMATICO SE BORRA: un nombre pegado a
   otro documento es el nombre de otra persona.
   Mientras consulta: el campo «escanea» y dice «Buscando en RENIEC…». */
function onDniInput(val){
  clearTimeout(_dniTimer);
  const dni=String(val||'').replace(/\D/g,'');
  const badge=$('dniBadge');
  const nm=$('f_name');
  const dniEl=$('f_dni');
  // El nombre que puso el DNI (completo o a medio aparecer) se va con él.
  if(_dniPuesto && nm && _dniPuesto.indexOf(nm.value.trim())===0){ clearInterval(_dniEscribir._t); nm.value=''; }
  _dniPuesto=''; _dniOficial=''; _dniMantener='';
  if(dniEl) dniEl.classList.remove('dni-escanea');
  if(badge){ badge.style.display='none'; badge.innerHTML=''; }
  _dniMarca();
  if(dni.length!==8) return;
  _dniTimer=setTimeout(async ()=>{
    const _decir=(html)=>{ if(badge){ badge.style.display='block'; badge.innerHTML=html; } };
    const _callar=()=>{ if(badge){ badge.style.display='none'; badge.innerHTML=''; } };
    if(dniEl) dniEl.classList.add('dni-escanea');
    _decir('<span class="dni-buscando">🪪 Buscando en RENIEC<span class="dni-puntos"></span></span>');
    const r = await _dniConsultar(dni, function(n, de){
      _decir('<span class="dni-buscando">🪪 Buscando en RENIEC<span class="dni-puntos"></span> (reintentando '+n+'/'+de+')</span>');
    });
    if(($('f_dni')||{value:''}).value.replace(/\D/g,'')!==dni) return;
    if(dniEl) dniEl.classList.remove('dni-escanea');
    if(!r || !r.ok || !r.persona || !r.persona.completo){

         su nombre completo (o reintenta). */

// Adquisición robusta y REUTILIZABLE de ubicación. Pre-chequea el permiso (para
// no fallar en silencio cuando está denegado) y hace DOS etapas: alta precisión
// y, si falla por timeout/no-disponible, baja precisión (wifi/celda). Nunca se
// cuelga (timeouts) y siempre resuelve por onOk o onErr.
// onErr(codigo) con codigo: 'denegado' | 'no_soporta' | 'inseguro' | 'fallo'.
// opc.rapida: UNA petición de baja precisión (wifi/antena), máx. 8 s, y vale
// una posición de los últimos 5 min. Para elegir una agencia (km) sobra; el
// GPS fino es para el delivery, que llama sin opciones y sigue igual.
function _obtenerUbicacion(onOk, onErr, opc){
  if(!window.isSecureContext){ onErr('inseguro'); return; }
  if(!navigator.geolocation){ onErr('no_soporta'); return; }
  var listo=false;
  var ok=function(pos){ if(listo) return; listo=true; onOk(pos); };
  var pedir=function(){
    if(opc && opc.rapida){
      navigator.geolocation.getCurrentPosition(ok, function(err){
        if(listo) return; listo=true;
        onErr(err&&err.code===1?'denegado':'fallo');
      }, {enableHighAccuracy:false, timeout:8000, maximumAge:300000});
      return;
    }
    var etapa2=function(){
      navigator.geolocation.getCurrentPosition(ok, function(err){
        if(listo) return; listo=true;
        onErr(err&&err.code===1?'denegado':'fallo');
      }, {enableHighAccuracy:false, timeout:8000, maximumAge:120000});
    };
    navigator.geolocation.getCurrentPosition(ok, function(err){
      if(listo) return;
      if(err&&err.code===1){ listo=true; onErr('denegado'); return; }
      etapa2(); // timeout / no disponible → reintento en baja precisión
    }, {enableHighAccuracy:true, timeout:8000, maximumAge:60000});
  };
  // Pre-chequeo de permiso (si la API existe): denegado → no llamar, guiar.
  if(navigator.permissions&&navigator.permissions.query){
    navigator.permissions.query({name:'geolocation'}).then(function(st){
      if(st&&st.state==='denied'){ onErr('denegado'); return; }
      pedir();
    }).catch(function(){ pedir(); });
  } else { pedir(); }
}

/* ═══ DELIVERY: la ubicación de la PUERTA (30/10/2026) ═══════════════════
   Misma tubería que las sedes (_ubicNativo, _ubicMensaje…), con precisión
   fina, y un mapa para VER y CORREGIR el punto: un GPS en interiores falla
   ±200 m y eso manda al motorizado a otra cuadra.
     · con ubicación → vista previa + «¿Es aquí tu casa?» [Sí] [Ajustar];
       si la precisión es mala (>100 m), se abre el ajuste;
     · sin ubicación → mensaje por causa + «marca tu casa en el mapa»;
     · el cuadro de dirección sigue siendo LA dirección: el punto la
       acompaña (gpsCoords), y solo se sugiere texto si está vacío.
   Nunca se pone un punto sin un toque del cliente. */
var _dlvFallos=0, _dlvNativo=false, _dlvToken=0, _dlvOk=false, _dlvAcc=0, _dlvMapa=null;
var _DLV_LIMA=[-12.0464,-77.0428];   // centro por defecto si no hay punto

/* El botón de siempre (navegadores sin el nativo). */
function usarMiUbicacion(){
  _gpsBtn('<span class="geo-pin">📍</span> Buscando tu ubicación…', true);
  _gpsMsg('');
  var mio=++_dlvToken, t0=Date.now();
  var luego=function(fn){ var r=Math.max(0, 700-(Date.now()-t0)); if(r) setTimeout(fn, r); else fn(); };
  _obtenerUbicacion(function(pos){ luego(function(){
    _gpsBtn('📍 Usar mi ubicación', false);
    if(mio===_dlvToken) _dlvExito(pos);
  }); }, function(codigo){ _agPermiso().then(function(estado){ luego(function(){
    _gpsBtn('📍 Usar mi ubicación', false);
    if(mio===_dlvToken) _dlvError(codigo, estado);
  }); }); });
}
/* El nativo, conectado UNA vez a la tubería compartida. */
function _dlvConectar(){
  var g=$('dlvGeoNativo'); if(!g || g._conectado) return;
  g._conectado=true;
  // La pista «Agrega el número» se va cuando ESCRIBE el cliente (solo
  // eventos reales: rellenar por código no dispara 'input').
  var ta=$('addrManualInput'); if(ta) ta.addEventListener('input', function(){ _dlvPista(false); _dlvTextoAuto=''; });
  var mio=0;
  _dlvNativo=_ubicNativo(g, {
    invalido: function(){ usarMiUbicacion(); },
    inicio:   function(){ mio=++_dlvToken; _gpsMsg('<div class="dlv-msg">'+_AG_BUSCANDO.replace('sedes cerca de ti','tu ubicación')+'</div>'); },
    vigente:  function(){ return mio===_dlvToken; },
    exito:    function(pos){ _dlvExito(pos); },
    error:    function(c, e){ _dlvError(c, e); }
  });
}
function _dlvExito(pos){
  var la=pos.coords.latitude, lo=pos.coords.longitude, acc=Math.round(pos.coords.accuracy||0);
  if(!AgLista.coords({latitud:la, longitud:lo})){ _dlvError('fuera', ''); return; }
  _dlvFallos=0; _ubicReintento=null; _ubicReintentoGps=false;
  _gpsMsg('');
  /* MISMA pantalla en celular y PC (30/10/2026): nada se abre solo. Antes,
     con más de 100 m de error (la PC por wifi da ±110) se abría el ajuste
     y salía un aviso amarillo; en el celular (GPS) no — el mismo link se
     veía distinto. Ajustar es siempre decisión del cliente. */
  _dlvPunto(la, lo, {acc:acc});
}
function _dlvError(codigo, estado){
  _dlvFallos++;
  var caso=_ubicCasoDe(codigo, estado||'');
  _ubicTrasFallo(caso, function(){ if(selCourierType==='delivery' && $('deliveryAddrBox')) usarMiUbicacion(); });
  _gpsMsg('<div class="dlv-msg">'+_ubicMensaje(caso, '<a role="button" onclick="dlvAjustar()">marca tu casa en el mapa</a>', _dlvNativo)
    +' También puedes escribir tu dirección abajo 👇</div>');
  if(_dlvFallos>=2){   // segundo intento sin suerte: al cuadro de dirección
    var ta=$('addrManualInput');
    if(ta){ try{ ta.focus({preventScroll:true}); ta.scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){} }
  }
}
/* ═══ LOS DATOS DE DELIVERY: DOS COSAS, CADA UNA EN SU SITIO ════════════
     · La DIRECCIÓN escrita (#addrManualInput) — obligatoria; es lo que van
       a leer la etiqueta, el WhatsApp y el panel (order.address).
     · El PUNTO en el mapa (_gpsLat/_gpsLon → order.gpsCoords) — opcional;
       es el enlace de Google Maps del WhatsApp.
   Se ayudan, nunca se pisan:
     · con punto, la dirección se LLENA SOLA (ver _dlvSugerirDireccion) y
       sigue al punto mientras el cliente no la toque;
     · lo que escribe el cliente es suyo: el punto ya no lo cambia ni lo borra;
     · número, Mz/Lt y referencia: opcionales, sugeridos en gris. */
var _DLV_PLACEHOLDER='Calle y número, Mz/Lt o dpto *';
var _dlvGeoMemo={};   // dirección ya consultada por punto (no repetir consultas)

/* EL punto de entrega: una sola función lo pone, venga del GPS o del ajuste. */
function _dlvPunto(la, lo, opc){
  opc=opc||{};
  _gpsLat=+Number(la).toFixed(6); _gpsLon=+Number(lo).toFixed(6);
  _dlvAcc=opc.acc||0; _dlvOk=!!opc.confirmado;
  _dlvSugerirDireccion(_gpsLat, _gpsLon);
  _dlvPintar(!!opc.salta);
  _dlvEstado();
  _paso3Continuar();
}
function quitarPin(){ _gpsLat=null; _gpsLon=null; _dlvReset(); }
function _dlvReset(){
  _dlvOk=false; _dlvAcc=0; _dlvFallos=0; _dlvToken++;
  // El texto que puso el punto se va con el punto; el del cliente se queda.
  var t0=$('addrManualInput');
  if(t0 && _dlvTextoAuto && t0.value===_dlvTextoAuto){ t0.value=''; onDireccionInput(); }
  _dlvTextoAuto='';
  _dlvModo('mirar');
  var p=$('dlvPrev'), c=$('dlvConfirma'), ta=$('addrManualInput');
  if(p) p.style.display='none';
  if(c){ c.style.display='none'; c.innerHTML=''; }
  if(ta) ta.placeholder=_DLV_PLACEHOLDER;
  _dlvPista(false);
}
function _dlvPista(on){ var e=$('dlvPista'); if(e) e.style.display=on?'block':'none'; }

/* La respuesta de OpenStreetMap → {calle, numero, zona}. */
function _dirDeNominatim(d){
  var a=(d&&d.address)||{};
  var road=a.road||a.pedestrian||a.footway||a.path||'';
  var num=a.house_number||'';
  var neigh=a.suburb||a.neighbourhood||a.city_district||a.quarter||'';
  var city=a.city||a.town||a.village||a.municipality||'';
  return {calle: road ? road+(num?' '+num:'') : '', numero: !!num,
    zona: [neigh, city!==neigh?city:''].filter(Boolean).join(', ')};
}
/* UNA consulta por punto (recordada), solo con el punto que sigue vigente:
   lo que pide el servicio gratuito de OpenStreetMap. */
/* ★ CON PUNTO, LA DIRECCIÓN SE LLENA SOLA (30/10/2026). El punto ya es la
   ubicación exacta (va en el enlace del WhatsApp): el texto es la ayuda
   para leerla y NO debe frenar al cliente. Se escribe lo mejor que haya
   —calle + barrio, o solo barrio, o «Punto marcado en el mapa» si el
   servicio no responde— y ese texto SIGUE al punto mientras el cliente no
   lo toque (_dlvTextoAuto). Apenas escribe algo, el texto es suyo. */
var _dlvTextoAuto='';
var _DLV_SIN_TEXTO='Punto marcado en el mapa';
function _dlvTextoDe(x){
  if(!x || x.fallo) return _DLV_SIN_TEXTO;
  return [x.calle, x.zona].filter(Boolean).join(', ') || _DLV_SIN_TEXTO;
}
function _dlvSugerirDireccion(la, lo){
  var k=la+','+lo;
  var usar=function(x){
    if(_gpsLat!==la || _gpsLon!==lo) return;          // ya es otro punto
    var ta=$('addrManualInput'); if(!ta) return;
    var mio = !!ta.value.trim() && ta.value!==_dlvTextoAuto;
    if(mio) return;                                   // lo escrito por el cliente manda
    ta.value=_dlvTextoAuto=_dlvTextoDe(x);
    onDireccionInput();
    _dlvPista(!(x && x.numero));
  };
  if(_dlvGeoMemo[k]){ usar(_dlvGeoMemo[k]); return; }
  // zoom=17: nivel de CALLE (trae la avenida más cercana, no solo el barrio).
  fetch('https://nominatim.openstreetmap.org/reverse?lat='+la+'&lon='+lo+'&zoom=17&format=json&accept-language=es')
    .then(function(r){ return r.json(); })
    .then(function(d){ _dlvGeoMemo[k]=_dirDeNominatim(d); usar(_dlvGeoMemo[k]); })
    .catch(function(){ usar({fallo:true}); });       // el cliente nunca queda bloqueado
}

/* ── EL mapa de delivery: uno, creado una vez, con dos modos ── */
var _dlvMarca=null, _dlvCirculo=null, _dlvModoAct='mirar';
function _dlvTactil(){ return !!(window.matchMedia && matchMedia('(pointer:coarse)').matches); }
function _dlvMapaListo(){
  return agMapaCargar().then(function(ok){
    var box=$('dlvPrev'); if(!ok || !window.L || !box) return null;
    try{
      box.style.display='block';
      if(!_dlvMapa || !box.contains(_dlvMapa.getContainer())){
        if(_dlvMapa){ try{ _dlvMapa.remove(); }catch(e){} }
        box.innerHTML='<div class="dlv-mapa" id="dlvMapaEl"></div>'
          +'<div class="dlv-aj-top">Mueve el mapa hasta que el pin quede en tu puerta</div>'
          +'<div class="dlv-aj-pin">'+_agIcono(true).options.html+'</div>'
          +'<div class="ag-mapa-dedos" id="dlvDedos" aria-hidden="true"></div>'
          +'<button type="button" class="dlv-volver" id="dlvVolverBtn" onclick="dlvVolver()">◎ Volver a mi punto</button>'
          +'<div class="dlv-aj-bot"><button type="button" class="dlv-aj-no" onclick="dlvAjusteCerrar()">Cancelar</button>'
          +'<button type="button" class="dlv-aj-ok" onclick="dlvAjusteOk()">✓ Entregar aquí</button></div>';
        _dlvMapa=L.map('dlvMapaEl',{dragging:!_dlvTactil(), touchZoom:true, scrollWheelZoom:false,
          doubleClickZoom:true, zoomControl:true, attributionControl:true});
        _mapaCapa(_dlvMapa);
        if(_dlvTactil()) _mapaDosDedos(_dlvMapa, $('dlvDedos'));
        _dlvMapa.on('moveend', _dlvVolverVisible);
        _dlvMarca=null;
      }
      return _dlvMapa;
    }catch(e){ box.style.display='none'; return null; }
  });
}
/* MIRAR: el pin fijo en el punto (no se toca). */
function _dlvPintar(salta){
  var box=$('dlvPrev'); if(!box) return;
  if(!(_gpsLat&&_gpsLon)){ if(_dlvModoAct!=='ajustar') box.style.display='none'; return; }
  _dlvMapaListo().then(function(m){
    if(!m || !(_gpsLat&&_gpsLon)) return;
    m.eachLayer(function(l){ if(!(l instanceof L.TileLayer)) m.removeLayer(l); });
    var c=[_gpsLat,_gpsLon];
    _dlvCirculo = (_dlvAcc>0 && !_dlvOk) ? L.circle(c,{radius:_dlvAcc, color:'#2d7ff9', weight:1, fillOpacity:.12, interactive:false}).addTo(m) : null;
    _dlvMarca=L.marker(c,{icon:_agIcono(true, salta), interactive:false, keyboard:false}).addTo(m);
    if(_dlvModoAct==='ajustar') _dlvMarcasVisibles(false);
    m.setView(c, 17);
    setTimeout(function(){ try{ m.invalidateSize(); if(_dlvModoAct!=='ajustar') m.setView(c, 17); }catch(e){} }, 60);
  });
}
/* Cambiar de modo: lo único que cambia es quién manda sobre el mapa. */
function _dlvModo(modo){
  _dlvModoAct=modo;
  var box=$('dlvPrev'), aj=(modo==='ajustar');
  if(box) box.classList.toggle('ajustando', aj);
  document.body.classList.toggle('dlv-ajustando', aj);
  var c=$('dlvConfirma'); if(c && aj) c.style.display='none';
  var dd=$('dlvDedos'); if(dd) dd.classList.remove('on');   // el aviso de «mirar» no sigue encima
  if(_dlvMapa){
    try{
      if(aj || !_dlvTactil()) _dlvMapa.dragging.enable(); else _dlvMapa.dragging.disable();
      _dlvMarcasVisibles(!aj);
      setTimeout(function(){ try{ _dlvMapa.invalidateSize(); }catch(e){} }, 60);
    }catch(e){}
  }
  _dlvVolverVisible();
}
/* En AJUSTAR solo se ve el pin del centro: el del punto y su círculo se ocultan. */
function _dlvMarcasVisibles(si){
  try{
    if(_dlvMarca) _dlvMarca.setOpacity(si?1:0);
    if(_dlvCirculo) _dlvCirculo.setStyle({opacity:si?1:0, fillOpacity:si?.12:0});
  }catch(e){}
}
/* «◎ Volver a mi punto» aparece si la vista se alejó del punto. */
function _dlvVolverVisible(){
  var b=$('dlvVolverBtn'); if(!b) return;
  var lejos=false;
  try{
    if(_dlvMapa && _gpsLat && _dlvModoAct==='mirar'){
      var a=_dlvMapa.latLngToContainerPoint([_gpsLat,_gpsLon]), z=_dlvMapa.getSize();
      lejos = a.x<20 || a.y<20 || a.x>z.x-20 || a.y>z.y-20 || _dlvMapa.getZoom()<14;
    }
  }catch(e){}
  b.classList.toggle('on', lejos);
}
function dlvVolver(){ if(_dlvMapa && _gpsLat) _dlvMapa.setView([_gpsLat,_gpsLon], 17); }

/* «¿Es aquí tu casa?» → [Sí] [Ajustar]; confirmado → «¡Listo!». */
function _dlvEstado(){
  var c=$('dlvConfirma'); if(!c) return;

    +'<div class="dlv-btns"><button type="button" class="dlv-si" onclick="dlvConfirmar()">✓ Sí, es aquí</button>'
    +'<button type="button" class="dlv-aj" onclick="dlvAjustar()">Ajustar punto</button></div>'+quitar;
}
function dlvConfirmar(){

/* AJUSTAR: SOLO desde su botón (o «marca tu casa» sin ubicación). Sin
   punto previo, empieza en Lima. Cancelar deja todo como estaba. */
function dlvAjustar(opc){
  opc=opc||{};
  _dlvMapaListo().then(function(m){
    if(!m){
      _gpsMsg('<div class="dlv-msg">No pudimos abrir el mapa. Escribe tu dirección abajo 👇</div>');
      var ta=$('addrManualInput'); if(ta){ try{ ta.focus(); }catch(e){} }

    setTimeout(function(){ try{ m.invalidateSize(); m.setView(c, z); }catch(e){} }, 60);
    if(!_dlvTactil()){ try{ $('dlvPrev').scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){} }

function dlvAjusteCerrar(){

  if(_gpsLat&&_gpsLon) _dlvPintar(false);
  else { var b=$('dlvPrev'); if(b) b.style.display='none'; }

function dlvAjusteOk(){

  if(!AgLista.coords({latitud:c.lat, longitud:c.lng})){ dlvAjusteCerrar(); _dlvError('fuera',''); return; }
  _gpsMsg('');

}

/* ★ ENLACE DE MAPA — UNA forma para todo el formulario: el formato oficial
   de Google Maps URLs (abre la app en Android/iPhone y la web en PC; gratis,
   sin clave; la coma va codificada). 6 decimales ≈ 10 cm. Coordenadas raras
   o fuera del Perú → sin enlace. Lo usan el chip «Ver mapa» y el WhatsApp. */
var EnlaceMapa = {
  de: function(coords){
    var p=String(coords==null?'':coords).split(',');
    if(p.length!==2 || !p[0].trim() || !p[1].trim()) return '';
    var la=Number(p[0]), lo=Number(p[1]);
    if(!isFinite(la) || !isFinite(lo)) return '';
    if(la<-19||la>0||lo<-82||lo>-68) return '';
    return 'https://www.google.com/maps/search/?api=1&query='+la.toFixed(6)+'%2C'+lo.toFixed(6);
  }
};

/* ─── DATE CHIPS ────────────────────────────────────────────────── */
function buildDatesChips(dispatch){
  const days         = Array.isArray(dispatch.days) ? dispatch.days : [1,2,3,4,5];
  const cutHour      = dispatch.cutHour||'23:59';
  const anticipation = parseInt(dispatch.anticipation)||0;
  const DAY_SHORT    = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const MON_SHORT    = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

  const now   = new Date();
  const [ch,cm] = cutHour.split(':').map(Number);
  let start = new Date(now);
  start.setHours(0,0,0,0);
  start.setDate(start.getDate()+anticipation);
  const nowMins = now.getHours()*60+now.getMinutes();
  const cutMins = (ch||0)*60+(cm||0);
  if(nowMins>=cutMins) start.setDate(start.getDate()+1);

  const dates=[];
  let probe=new Date(start);
  for(let i=0;i<30&&dates.length<7;i++){
    if(!days.length||days.includes(probe.getDay())) dates.push(new Date(probe));
    probe.setDate(probe.getDate()+1);
  }

  if(!dates.length) return '<div style="color:var(--text2);font-size:13px">No hay fechas disponibles</div>';

  return dates.map(d=>{
    const iso  = isoDate(d);
    const dayN = DAY_SHORT[d.getDay()];
    const num  = d.getDate();
    const mon  = MON_SHORT[d.getMonth()];
    return `<div class="date-opt" id="dopt_${iso}" onclick="selDate('${iso}','${dayN} ${num} ${mon}')">
      <div class="d-day">${dayN}</div>
      <div class="d-num">${num}</div>
      <div class="d-mon">${mon}</div>
    </div>`;
  }).join('');
}

function selDate(iso, lbl){
  /* Solo un toque REAL del cliente anima y vibra: el formulario preelige la
     primera fecha con un clic del programa (isTrusted=false). */
  const ev = window.event;
  const nueva = iso!==selDateIso && !!(ev && ev.isTrusted);
  selDateIso=iso; selDateLbl=lbl;
  document.querySelectorAll('.date-opt').forEach(el=>el.classList.remove('active'));
  const el=$('dopt_'+iso);
  if(el) el.classList.add('active');
  $('err_date')&&$('err_date').classList.remove('show');
  /* ★ La decisión, dicha con todas sus palabras («sale el martes 3 de
     noviembre»): quita la duda de haber tocado el día equivocado. */
  const ok=$('dateOk');
  if(ok){
    let txt='';
    try{ txt=new Date(iso+'T12:00:00').toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'}).replace(',',''); }catch(e){ txt=lbl; }
    ok.textContent='📦 Tu pedido sale el '+txt;
    ok.classList.remove('on'); void ok.offsetWidth; ok.classList.add('on');
  }
  if(nueva){ _ttPop(el); _ttVibrar(); _ttBrillo($('confirmBtn')); }
}
/* Microinteracciones compartidas (fecha y sede). */
function _ttPop(el){ if(!el) return; el.classList.remove('tt-pop'); void el.offsetWidth; el.classList.add('tt-pop'); }
function _ttBrillo(b){ if(!b) return; b.classList.remove('tt-brillo'); void b.offsetWidth; b.classList.add('tt-brillo'); setTimeout(function(){ b.classList.remove('tt-brillo'); }, 1000); }
// Vibración corta SOLO al elegir (no en cada toque). Android; iPhone no la tiene.
function _ttVibrar(){
  try{
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if(navigator.vibrate) navigator.vibrate(12);
  }catch(e){}
}

/* ─── SUBMIT ────────────────────────────────────────────────────── */
/* ─── Mensaje de WhatsApp (centralizado y mejorado) ──────────────── */
// Construye el texto del pedido para WhatsApp con mejor formato.
function _construirWaMsg(order, trackCode, trackToken){
  const bizName  = (CFG&&(CFG.config&&CFG.config.name||CFG.name))||'Mi Negocio';
  const dateLabel = order.date
    ? new Date(order.date+'T12:00:00').toLocaleDateString('es-PE',{weekday:'long',year:'numeric',month:'long',day:'numeric'})
    : selDateLbl||order.date;
  const trackUrl = `${location.origin}${location.pathname.replace(/[^/]*$/, 'seguimiento.html')}?seg=${trackToken}`;

  const refLine  = order.referencia    ? `\n📌 *Referencia:* ${order.referencia}` : '';
  /* ★ La PUERTA, tocable: solo en delivery y solo si el cliente dio o
     confirmó su punto. Sale de order.gpsCoords — lo MISMO que guarda el
     pedido: el panel y el WhatsApp no pueden decir dos cosas distintas. */
  const _mapaUrl = selCourierType==='delivery' ? EnlaceMapa.de(order.gpsCoords) : '';
  const mapaLine = _mapaUrl ? `\n🗺️ *Ubicación exacta:* ${_mapaUrl}` : '';
  // DNI: fuente única = order.dni (llega en todos los couriers). La etiqueta
  // solo cambia el matiz según el tipo de envío.
  const _dniLbl  = selCourierType==='agencia'    ? 'DNI para recoger'
                 : selCourierType==='encomienda'  ? 'DNI destinatario'
                 :                                   'DNI';
  const dniLine  = order.dni ? `\n🪪 *${_dniLbl}:* ${order.dni}` : '';
  const encLine  = order.ciudadDestino ? `\n📦 *Ciudad destino:* ${order.ciudadDestino}` : '';
  const notesLine= order.notes ? `\n📝 *Notas:* ${order.notes}` : '';
  /* N° de factura/boleta: lo puso la tienda en el link y lo devuelve el
     servidor al crear el pedido (el cliente no lo escribe). Solo letras,
     números y guion — ya viene limpio, pero se vuelve a filtrar. */
  const _nroTxt  = String(order.nroComprobante||'').replace(/[^A-Z0-9-]/g,'').slice(0,20);
  const nroLine  = _nroTxt ? `\n🧾 *Factura/Boleta:* ${_nroTxt}` : '';
  const dirLabel = selCourierType==='agencia'
    ? `\n🏢 *Agencia:* ${order.address||'—'}`
    : selCourierType==='retiro'
      ? `\n🏪 *Retiro en tienda*`            // no hay dirección del cliente: decirlo, no «—»
      : `\n🏠 *Dirección:* ${order.address||order.ciudadDestino||'—'}`;

  // Mensaje con formato mejorado (negritas de WhatsApp con *, secciones claras)
  return `🛒 *NUEVO PEDIDO* — ${bizName}\n`+
    `━━━━━━━━━━━━━━━\n`+
    `👤 *Cliente:* ${order.name}\n`+
    `📞 *WhatsApp:* ${order.phone}`+
    `${dirLabel}${refLine}${mapaLine}${dniLine}${encLine}\n`+
    `🚚 *Courier:* ${order.courier}\n`+
    `📅 *Fecha de envío:* ${dateLabel}${notesLine}\n`+
    `━━━━━━━━━━━━━━━\n`+
    /* Con factura/boleta, ESE es el código: sale solo él. Sin ella, el
       código de seguimiento de siempre. */
    (nroLine ? `${nroLine.slice(1)}\n\n` : `🔑 *Código de seguimiento:* #${trackCode}\n\n`)+
    `📍 *Para ver el estado de tu pedido en tiempo real, abre este enlace:*\n${trackUrl}`;
}

function _construirWaHref(order, trackCode, trackToken){
  let bizPhone = (CFG&&(CFG.config&&CFG.config.phone||CFG.phone))||'';
  bizPhone = String(bizPhone).replace(/\D/g,'');
  if(bizPhone.startsWith('51') && bizPhone.length>9) bizPhone = bizPhone.slice(2);
  const msg = _construirWaMsg(order, trackCode, trackToken);
  // Con número del negocio → mensaje directo al negocio.
  // Sin número (caso extremo) → abre WhatsApp con el mensaje listo para enviar.
  return bizPhone
    ? `https://wa.me/51${bizPhone}?text=${encodeURIComponent(msg)}`
    : `https://wa.me/?text=${encodeURIComponent(msg)}`;
}

async function submitOrder(){
  const name  = ($('f_name')||{value:''}).value.trim();
  const phone = ($('f_phone')||{value:''}).value.trim();

  function chk(fid,eid,bad){
    const fe=$(fid),ee=$(eid);
    if(bad){fe&&fe.classList.add('err');ee&&ee.classList.add('show');}
    else   {fe&&fe.classList.remove('err');ee&&ee.classList.remove('show');}
    return bad;
  }

  let ok=true;
  if(chk('f_name','err_name',!_nombreValido(name))) ok=false;
  if(chk('f_phone','err_phone',!/^\d{9}$/.test(phone))) ok=false;

  if(!selCourierName){ $('err_courier')&&$('err_courier').classList.add('show'); ok=false; }
  else               { $('err_courier')&&$('err_courier').classList.remove('show'); }
  // Validación de agencia: si es OLVA/manual, leer directo del campo (robusto)
  const manualAgInput = $('agcManualInput');
  if(manualAgInput){
    // Modo manual (OLVA): tomar lo escrito directamente
    const manualTxt = manualAgInput.value.trim();
    agState.addr = manualTxt; // sincronizar por si acaso
    if(selCourierType==='agencia' && !manualTxt){
      $('err_agency_manual')&&$('err_agency_manual').classList.add('show'); ok=false;
    } else {
      $('err_agency_manual')&&$('err_agency_manual').classList.remove('show');
    }
  } else if(selCourierType==='agencia'&&!agState.addr){
    $('err_agency')&&$('err_agency').classList.add('show'); ok=false;
  } else {
    $('err_agency')&&$('err_agency').classList.remove('show');
  }
  if(!selDateIso)    { $('err_date')&&$('err_date').classList.add('show'); ok=false; }
  else               { $('err_date')&&$('err_date').classList.remove('show'); }

  // DNI (paso 1): obligatorio para todos (8 dígitos) — red de seguridad.
  {
    const dni=($('f_dni')||{value:''}).value.trim();
    if(!/^\d{8}$/.test(dni)){ $('err_dni')&&$('err_dni').classList.add('show'); ok=false; }
    else                    { $('err_dni')&&$('err_dni').classList.remove('show'); }
  }

  // Encomienda: validate ciudad
  if(selCourierType==='encomienda'){
    const ciudad=($('f_ciudad')||{value:''}).value.trim();
    if(!ciudad){ $('err_ciudad')&&$('err_ciudad').classList.add('show'); ok=false; }
    else       { $('err_ciudad')&&$('err_ciudad').classList.remove('show'); }
  }

  const extraF=((CFG&&CFG.extraFields)||[]).filter(f=>f&&f.visible!==false);
  extraF.forEach(f=>{
    const fname=typeof f==='string'?f:(f.name||'');
    const isReq=typeof f==='object'&&!!f.required;
    if(!isReq) return;
    const el=$('ex_'+fname.replace(/\W/g,'_'));
    const er=$('exerr_'+fname.replace(/\W/g,'_'));
    if(el&&!el.value.trim()){el.classList.add('err');er&&er.classList.add('show');ok=false;}
    else if(el){el.classList.remove('err');er&&er.classList.remove('show');}
  });

  let deliveryAddress='';
  let referencia='';
  if(selCourierType==='delivery'){
    deliveryAddress=getDeliveryAddr();   // fuente única (misma que usa la boleta)
    referencia=($('f_ref')||{value:''}).value.trim();
    if(!deliveryAddress){$('err_deliveryAddr')&&$('err_deliveryAddr').classList.add('show');ok=false;}
    else               {$('err_deliveryAddr')&&$('err_deliveryAddr').classList.remove('show');}
  }

  if(!ok) return;

  let fullNotes=($('f_notes')||{value:''}).value.trim();
  const _dni             = ($('f_dni')||{value:''}).value.trim();   // DNI único del paso 1
  const dniRecoger       = selCourierType==='agencia'    ? _dni : '';
  const ciudadDestino    = selCourierType==='encomienda'  ? ($('f_ciudad')||{value:''}).value.trim()      : '';
  const dniDestinatario  = selCourierType==='encomienda'  ? _dni : '';
  const encAgencia       = selCourierType==='encomienda'  ? ($('f_agencia') ||{value:''}).value.trim()    : '';

  // Dirección final: para agencia usar la dirección de la agencia, para delivery usar la del cliente
  let finalAddress = deliveryAddress;
  if(selCourierType==='agencia' && agState.addr){
    finalAddress = agState.addr; // la dirección de la agencia va en address
  }

  const now      = Date.now();
  const orderId  = `id_${now}`;

  /* La identificación sobrevive solo si la dirección final es literalmente
     la que puso el selector. Se compara el TEXTO y no se confía en eventos:
     entre elegir y enviar puede haber pasado un cambio de courier, una
     edición a mano o un relleno automático, y cualquiera de los tres deja el
     id apuntando a otra agencia. Misma regla que el panel. */
  const _agOk = (window._agIdent && window._agIdentTxt === finalAddress)
    ? window._agIdent : null;

  const order = {
    id:             orderId,
    name,
    phone,
    address:        finalAddress,
    agenciaId:      _agOk ? _agOk.agenciaId      : '',
    agenciaNombre:  _agOk ? _agOk.agenciaNombre  : '',
    agenciaGeo:     _agOk ? _agOk.agenciaGeo     : '',
    agenciaCourier: _agOk ? _agOk.agenciaCourier : '',
    gpsCoords:      (_gpsLat&&_gpsLon) ? `${_gpsLat},${_gpsLon}` : null,
    referencia,
    dniRecoger,
    ciudadDestino,
    dniDestinatario,
    encAgencia,
    courier:        selCourierName,
    date:           selDateIso,
    status:         'NUEVO PEDIDO',
    cost:           '',
    notes:          fullNotes,
    extra:          collectExtra(),
    docGuia:        null,
    docEmbalado:    null,
    docComprobante: null,
    links:          _prefillLink ? [{u:_prefillLink, n:_prefillLink.length>36?_prefillLink.substring(0,36)+'…':_prefillLink}] : [],
    sel:            false,
    chkGuia:        false,
    chkEmbalado:    false,
    chkComprobante: false,
    createdAt:      new Date().toISOString(),
    fromForm:       true,
    dni:            _dni || dniRecoger || dniDestinatario || '',
  };

  const btn=$('confirmBtn');
  $('submitErrBox')&&($('submitErrBox').style.display='none');
  const t0=_confEmpezar(btn);   // sin telón: el botón avanza y la etiqueta «se imprime»

  try{
    // Crear el pedido vía Cloud Function (el público ya no escribe Firestore directo)
    const resp = await _api('create', null, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ order: order, token: currentToken || '' })
    });
    if(!resp || resp.status !== 'ok' || !resp.trackToken){
      throw new Error((resp && resp.error) || 'No se pudo registrar');
    }
    order.id = resp.orderId; // id real asignado por el servidor
    if(resp.nroComprobante) order.nroComprobante = String(resp.nroComprobante);
    localStorage.setItem('dpanel_order_'+wsId, JSON.stringify({
      trackToken: resp.trackToken, orderId: resp.orderId, name: order.name
    }));
    // La «impresión» se ve al menos 0,9 s: si el servidor responde al
    // instante, el sello no cae antes de que se entienda qué pasa.
    const espera=Math.max(0, 900-(Date.now()-t0));
    setTimeout(function(){ showInlineConfirmed(order, codigoSeg(order.id, order.createdAt), resp.trackToken); }, espera);
  }catch(e){
    _confFallo(btn);
    const eb=$('submitErrBox');
    if(eb){ eb.style.display='block'; eb.textContent=`Error al registrar: ${e.message}`; }
  }
}

/* ─── CONFIRMACIÓN EN EL SITIO (30/10/2026) ───────────────────────────
   Sin telón ni cambio de pantalla. El pedido YA se registró (llega al
   panel); aquí se celebra y se lleva al cliente a WhatsApp:
     1. mientras registra: el botón avanza y la etiqueta «se imprime»;
     2. al responder: los pasos se recogen, cae el sello «✓ REGISTRADO»
        con el código, confeti breve y vibración — el PICO (regla del pico
        y el final: es lo que se recuerda);
     3. abajo, WhatsApp con la verdad: barra «falta 1 toque», la burbuja
        con lo que se va a enviar (sin sorpresas) y el beneficio real (el
        link de seguimiento). Si vuelve sin enviarlo, se le recuerda; si lo
        tocó, «¿Ya lo enviaste?».
   ⚠️ Nada de mentir: el pedido está registrado aunque no envíe WhatsApp, y

function _confEmpezar(btn){

    btn.disabled=true; btn.classList.add('tt-registrando');

/* ─── BUSCADOR DE AGENCIAS (Shalom, Olva, …) ─────────────────────────
   Una sola fuente de datos por courier: JSON local (rápido, sin red) →
   caché de localStorage (24h) → Cloud Function en vivo (respaldo). El mismo
   widget/lógica sirve para cualquier courier que esté en este mapa; agregar
   uno nuevo = una entrada más, sin tocar el resto del buscador. */
const AGENCY_SOURCES = {
  SHALOM: {
    label: 'Shalom',
    version: '2026-10-30', // meta.generado
    jsonPath: './data/agencias-shalom.json',
    // Sin respaldo en vivo: la función agenciasShalom se retiró (el portal de
    // Shalom exige reCAPTCHA v3). El buscador usa solo el catálogo local, que
    // es rápido y funciona sin red. Ver docs/SHALOM.md.
    apiUrl: '',
    cacheKey: 'shalom'
  },
  OLVA: {
    label: 'Olva',
    jsonPath: './data/agencias-olva.json',
    apiUrl: 'https://us-central1-total-tools-24ce8.cloudfunctions.net/agenciasOlva',
    cacheKey: 'olva'
  }
};
function _agSourceKey(courierName){
  const u=(courierName||'').toUpperCase();
  if(u.includes('SHALOM')) return 'SHALOM';
  if(u.includes('OLVA'))   return 'OLVA';
  return null;
}
let _agTimer = null;
window._agData  = window._agData  || {}; // por courier: catálogo normalizado
window._agCache = window._agCache || {}; // por courier: últimos resultados mostrados
window._agSel   = window._agSel   || {}; // por courier: agencia elegida (objeto completo)

async function agPrecargar(key){
  const cfg = AGENCY_SOURCES[key]; if(!cfg) return;
  if(window._agData[key] && window._agData[key].length) return;
  const cacheK = 'ag_agencias_cache_' + cfg.cacheKey;
  const timeK  = 'ag_agencias_time_'  + cfg.cacheKey;
  /* ★ VERSIÓN DEL CATÁLOGO (`cfg.version`) = fecha de `meta.generado` del
     JSON. Al actualizar data/agencias-shalom.json se cambia allí y en
     config.js (SHALOM_CATALOGO_V); una prueba exige que coincidan. Sin esto,
     un navegador que ya tenía la lista la seguía usando hasta 24 h. */
  const verK   = 'ag_agencias_ver_'   + cfg.cacheKey;
  // 1. Intentar cache localStorage (24h) — y de la MISMA versión del catálogo.
  try{
    const cached = localStorage.getItem(cacheK);
    const cachedTime = parseInt(localStorage.getItem(timeK)||'0');
    const verOk = !cfg.version || localStorage.getItem(verK) === cfg.version;
    if(cached && verOk && (Date.now()-cachedTime) < 86400000){
      window._agData[key] = JSON.parse(cached);
      return;
    }
  }catch(ce){}
  // 2. Intentar JSON local ./data/agencias-<courier>.json
  try{
    // `?v=`: que el navegador no sirva la copia vieja del archivo.
    const rLocal = await fetch(cfg.jsonPath + (cfg.version ? '?v=' + cfg.version : ''));
    if(rLocal.ok){
      const jLocal = await rLocal.json();
      const listaLocal = jLocal.agencias || jLocal.data || jLocal || [];
      if(Array.isArray(listaLocal) && listaLocal.length > 0){
        window._agData[key] = listaLocal;
        try{
          localStorage.setItem(cacheK, JSON.stringify(listaLocal));
          localStorage.setItem(timeK, String(Date.now()));
          if(cfg.version) localStorage.setItem(verK, cfg.version);
        }catch(se){}
        return;
      }
    }
  }catch(le){ console.warn('['+cfg.label+'] JSON local no disponible:', le.message); }
  // 3. Fallback: Cloud Function en vivo (solo si el courier la tiene; Shalom ya
  //    no — se queda con el catálogo local cargado arriba).
  if(!cfg.apiUrl) return;
  try{
    const r = await fetch(cfg.apiUrl);
    if(!r.ok) return;
    const j = await r.json();
    const lista = j.resultados || j.agencias || j.data || j || [];
    if(Array.isArray(lista) && lista.length){
      window._agData[key] = lista;
      localStorage.setItem(cacheK, JSON.stringify(lista));
      localStorage.setItem(timeK, String(Date.now()));
    }
  }catch(e){}
}
