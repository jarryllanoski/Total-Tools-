// Distancia en km entre dos coordenadas (haversine, client-side).
function _haversineKm(la1,lo1,la2,lo2){
  var R=6371, toR=Math.PI/180;
  var dLa=(la2-la1)*toR, dLo=(lo2-lo1)*toR;
  var a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1*toR)*Math.cos(la2*toR)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
/* ═══ ELEGIR SEDE: ubicación, mapa y lista (31/10/2026) ════════════════
   UNA VERDAD: la LISTA (_agCache[key]). Todo lo demás solo decide QUÉ
   lista se ve:
     · «Usar mi ubicación» → las más cercanas a ti;
     · tocar el mapa       → las más cercanas a ese punto (sin permiso);
     · escribir            → las que coinciden;
     · tocar un pin        → esa sede, elegida, ARRIBA de la lista.
   Elegir es UNA puerta (_agElegir), venga de un pin o de una fila: dos
   caminos serían dos maneras de perder el ter_id que necesita el registro
   en Shalom. Si algo falla (permiso, red, mapa), lo demás sigue. Cero
   lecturas en la nube: catálogo local y distancias en el teléfono. */
var _cercaToken=0;        // invalida resultados tardíos si el cliente ya escribió
var _cercaEnCurso=false;  // guard doble-toque
var _agRef=null;          // {la, lo, tipo:'tu'|'punto'|'sede'} desde dónde se mide
var _agElegidaK='';       // clave de la sede elegida (ter_id, o nombre+dirección)
var _AG_CERCA_N=20;       // cuántas sedes cercanas se listan

/* Lógica PURA de la lista (sin DOM): se prueba sola. */
var AgLista = {
  clave: function(ag){
    if(!ag) return '';
    return ag.ter_id ? 'id:'+ag.ter_id : 'n:'+String(ag.nombre||'')+'|'+String(ag.direccion||'');
  },
  coords: function(ag){
    var la=parseFloat(ag&&ag.latitud), lo=parseFloat(ag&&ag.longitud);
    if(!isFinite(la)||!isFinite(lo)) return null;
    if(la<-19||la>0||lo<-82||lo>-68) return null;   // fuera de Perú = dato malo
    return [la,lo];
  },
  /* «LIMA / LIMA / CARABAYLLO / AV JOSE SACO ROJAS» → «Shalom Carabayllo
     (Av Jose Saco Rojas)». Olva («TIENDA CHACHAPOYAS - JR…») queda tal cual,
     en minúsculas bonitas. */
  titulo: function(ag, marca){
    var bonito=function(t){ return String(t||'').toLowerCase().replace(/(^|[\s(\/.-])([a-záéíóúñü])/g,function(m,a,b){ return a+b.toUpperCase(); }); };
    var n=String((ag&&(ag.lugar_over||ag.nombre))||'').trim();
    var partes=n.split('/').map(function(x){ return x.trim(); }).filter(Boolean);
    if(partes.length<2) return bonito(n)||'Sede';
    var dist=bonito(ag.distrito||partes[2]||partes[partes.length-2]);
    var ult=bonito(partes[partes.length-1]);
    var base=(marca?marca+' ':'')+dist;
    return (ult && ult.toLowerCase()!==dist.toLowerCase()) ? base+' ('+ult+')' : base;
  },
  km: function(d){
    if(d==null||!isFinite(d)) return '';
    return d<1 ? Math.round(d*1000)+' m' : d.toFixed(1)+' km';
  },
  /* Las `n` más cercanas a un punto, con su distancia. Las que no tienen
     coordenadas no entran (no se puede decir que estén cerca). */
  cercanas: function(todas, la, lo, n){
    return (todas||[]).map(function(ag){
      var c=AgLista.coords(ag); if(!c) return null;
      var x=Object.assign({}, ag); x._distKm=_haversineKm(la,lo,c[0],c[1]); return x;
    }).filter(Boolean).sort(function(a,b){ return a._distKm-b._distKm; }).slice(0, n||20);
  },
  /* La elegida, PRIMERA. Si no estaba en la lista, se añade arriba. */
  conElegida: function(lista, elegida){
    if(!elegida) return (lista||[]).slice();
    var k=AgLista.clave(elegida);
    var resto=(lista||[]).filter(function(ag){ return AgLista.clave(ag)!==k; });
    var la=(lista||[]).find(function(ag){ return AgLista.clave(ag)===k; })||elegida;
    return [la].concat(resto);
  }
};

function _agTodas(key){ return (window._agData && window._agData[key]) || []; }
function _agElegidaObj(key){
  if(!_agElegidaK) return null;
  return _agTodas(key).find(function(ag){ return AgLista.clave(ag)===_agElegidaK; }) || null;
}

/* Al llegar al paso: el mapa con TODAS las sedes (para tocar tu zona), y si
   el cliente YA había dado permiso de ubicación, se ubica solo, sin
   preguntar nada. Nunca se pide permiso sin que el cliente toque algo. */
function agIniciar(key){
  var el=_agElegidaObj(key);
  if(el){ _agElegir(key, el); return; }               // volvió al paso: su sede sigue arriba
  agMapaPintar(key, _agTodas(key), {todas:true});
  try{
    if(navigator.permissions && navigator.permissions.query){
      navigator.permissions.query({name:'geolocation'}).then(function(st){
        if(st && st.state==='granted') agUbicarme(key, {silencioso:true});
      }).catch(function(){});
    }
  }catch(e){}
}

/* El paso de la sede se pinta al elegir el courier (paso 1), pero se VE en
   el paso 3. Iniciarlo entonces dibujaría el mapa en un contenedor oculto
   —Leaflet lo mide en cero y sale gris al aparecer— y se miraría la
   ubicación fuera de contexto. Se espera a que el paso esté en pantalla. */
var _agVerObs=null;
function agIniciarAlVer(key){
  var caja=$('agUbicCaja'); var box=caja && caja.parentNode;
  var arrancar=function(){
    agPrecargar(key).then(function(){ agIniciar(key); }, function(){ agIniciar(key); });
  };
  try{ if(_agVerObs){ _agVerObs.disconnect(); _agVerObs=null; } }catch(e){}
  if(!box || typeof IntersectionObserver!=='function'){ arrancar(); return; }
  _agVerObs=new IntersectionObserver(function(ent){
    if(ent.some(function(x){ return x.isIntersecting; })){
      try{ _agVerObs.disconnect(); }catch(e){} _agVerObs=null;
      arrancar();
    }
  });
  _agVerObs.observe(box);
}

// Estado del botón principal: el texto dice lo que GANA el cliente.
function _cercaBtnBuscando(on){
  var btn=document.getElementById('shalomCercaBtn'); if(!btn) return;
  var txt=btn.querySelector('.cerca-txt'); if(!txt) return;
  btn.disabled=on;
  txt.textContent=on?'Buscando sedes cerca de ti…':'Usar mi ubicación';
}
// Si no se pudo ubicar: se dice QUÉ hacer, sin callejón sin salida.
function _agUbicFallo(codigo){
  var caja=$('agUbicCaja'), sub=$('agUbicSub'); if(!caja||!sub) return;
  caja.classList.add('ag-ubic-error');
  var msg = codigo==='denegado'
    ? 'Tu navegador tiene la ubicación bloqueada para esta página. Toca tu zona en el mapa o escribe tu distrito.'
    : 'No pudimos ubicarte. Toca tu zona en el mapa o escribe tu distrito.';
  if(_gpsWebviewInApp()){
    msg += ' Si lo abriste desde WhatsApp, ábrelo en Chrome para usar tu ubicación. '
      + '<button type="button" onclick="_gpsCopiarLink(this)" style="background:none;border:none;color:var(--blue);cursor:pointer;font-family:inherit;font-size:11.5px;text-decoration:underline;padding:0">Copiar enlace</button>';
  }
  sub.innerHTML=msg;
}

async function agUbicarme(key, opc){
  opc=opc||{};
  if(_cercaEnCurso) return;
  _cercaEnCurso=true;
  var myToken=++_cercaToken;
  if(!opc.silencioso) _cercaBtnBuscando(true);
  if(!_agTodas(key).length){ try{ await agPrecargar(key); }catch(e){} }
  if(myToken!==_cercaToken || !_agTodas(key).length){ _cercaEnCurso=false; _cercaBtnBuscando(false); return; }
  _obtenerUbicacion(function(pos){
    _cercaEnCurso=false; _cercaBtnBuscando(false);
    if(myToken!==_cercaToken) return;            // el cliente ya escribió: manda eso
    var la=pos.coords.latitude, lo=pos.coords.longitude;
    // Fuera de Perú (VPN, dato raro): no se ordena por algo que no sirve.
    if(!AgLista.coords({latitud:la, longitud:lo})){ if(!opc.silencioso) _agUbicFallo('fuera'); return; }
    // No sale del navegador: solo ordena la lista y pinta tu punto.
    _miUbic={la:la, lo:lo};
    _agRef={la:la, lo:lo, tipo:'tu'};
    var caja=$('agUbicCaja'); if(caja) caja.style.display='none';
    var inp=$('shalomAgInput'); if(inp) inp.value='';
    agMostrar(key, AgLista.cercanas(_agTodas(key), la, lo, _AG_CERCA_N), '');
  }, function(codigo){
    _cercaEnCurso=false; _cercaBtnBuscando(false);
    if(myToken!==_cercaToken || opc.silencioso) return;
    _agUbicFallo(codigo);
  }, {rapida:true});
}
// Compatibilidad: el nombre de antes sigue funcionando.
function agCerca(key){ return agUbicarme(key); }

/* Tocar el mapa en un punto vacío: las sedes cerca de ESE punto. Funciona
   sin permiso de ubicación — es el camino de quien no la quiere dar. */
function agPuntoMapa(key, la, lo){
  _cercaToken++;
  _agRef={la:la, lo:lo, tipo:'punto'};
  var inp=$('shalomAgInput'); if(inp) inp.value='';
  agMostrar(key, AgLista.cercanas(_agTodas(key), la, lo, _AG_CERCA_N), '');
}
function agVerTodos(key){
  try{
    if(!_mapa) return;
    var pts=_mapaMarcas.map(function(x){ return x.m.getLatLng(); });
    if(_miUbic) pts.push(L.latLng(_miUbic.la,_miUbic.lo));
    if(pts.length) _mapa.fitBounds(L.latLngBounds(pts), {padding:[24,24], maxZoom:15});
  }catch(e){}
}
function agMiPosicion(key){
  if(_miUbic && _mapa){ try{ _mapa.setView([_miUbic.la,_miUbic.lo], 14, {animate:true}); }catch(e){} return; }
  agUbicarme(key);
}
async function agBuscar(key, q){
  const cfg = AGENCY_SOURCES[key]; if(!cfg) return;
  const drop = $('shalomDrop');
  const spin = $('shalomSpin');
  try{
    let resultados = [];
    let aviso = '';
    // 1. Buscar en cache local
    const dataset = window._agData[key];
    if(dataset && dataset.length){
      const _nrm = s => String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      const qu = _nrm(q);
      // POR PALABRAS, no por frase literal. Antes se buscaba la consulta entera
      // como una sola cadena, asi que "Lima Miraflores" daba CERO: en el texto
      // pone "lima / lima / miraflores" y esas dos palabras nunca van seguidas.
      // Y "san juan lurigancho" tampoco, porque el nombre real lleva un "de" en
      // medio. Con palabras sueltas el orden da igual y los conectores sobran.
      // Se descartan las de 1 letra (harian coincidir todo); si no queda
      // ninguna, se usa la consulta entera como una sola palabra.
      let palabras = qu.split(/[\s/,.\-]+/).filter(w => w.length > 1);
      if(!palabras.length) palabras = [qu];
      const todasEn   = t => palabras.every(w => t.indexOf(w) !== -1);
      const abrenPalabra = t => palabras.every(w => (' '+t).indexOf(' '+w) !== -1);
      const _claveM = [];  // coincide por nombre/ubicación (prioritario)
      const _dirM   = [];  // coincide solo por dirección (relleno)
      dataset.forEach((ag,idx)=>{
        const clave = _nrm([ag.lugar_over||ag.nombre, ag.zona||ag.distrito, ag.provincia, ag.departamento].join(' '));
        const extra = _nrm(ag.direccion);
        let score;
        // Con UNA sola palabra estos tres niveles dan exactamente el mismo
        // resultado que la version anterior: las busquedas de una palabra no
        // cambian en nada.
        if(clave.indexOf(qu)===0)          score=0; // empieza con lo buscado, tal cual
        else if(abrenPalabra(clave))       score=1; // cada palabra empieza una palabra
        else if(todasEn(clave))            score=2; // todas, en nombre/ubicación
        else { if(palabras.every(w => clave.indexOf(w)!==-1 || extra.indexOf(w)!==-1))
                 _dirM.push({ag,idx});
               return; }
        _claveM.push({ag,score,idx});
      });
      _claveM.sort((a,b)=>a.score-b.score||a.idx-b.idx);
      resultados = _claveM.map(x=>x.ag);
      // Tope 40: cubre cualquier departamento salvo Lima (186). El dropdown scrollea.
      const TOPE = 40;
      // Relleno por dirección solo si falta para llenar, CON GUARDA:
      //  - si hay coincidencias por ubicación → solo del MISMO departamento (no mezcla zonas).
      //  - si NO hay ninguna (búsqueda por landmark/dirección pura) → permite todas
      //    (si no, devolvería 0 y rompería ese caso).
      if(resultados.length < TOPE && _dirM.length){
        const deps = new Set(_claveM.map(x=>x.ag.departamento));
        const relleno = _claveM.length ? _dirM.filter(x=>deps.has(x.ag.departamento)) : _dirM;
        resultados = resultados.concat(relleno.map(x=>x.ag));
      }
      // Aviso solo cuando hay MUCHAS por ubicación (caso Lima): guiar a afinar.
      if(_claveM.length > TOPE) aviso = _claveM.length + ' sedes — escribe tu distrito (ej. Miraflores) para afinar';
      resultados = resultados.slice(0, TOPE);
    }
    // 2. Si no hay resultados, consultar API (Shalom ya no la tiene → se omite)
    if(!resultados.length && cfg.apiUrl){
      const r = await fetch(cfg.apiUrl + '?q=' + encodeURIComponent(q));
      if(r.ok){
        const j = await r.json();
        const lista = j.resultados || j.agencias || j.data || j || [];
        resultados = (Array.isArray(lista)?lista:[]).slice(0,40);
      }
    }
    if(spin) spin.style.display='none';
    agMostrar(key, resultados, aviso);
  }catch(e){
    if(spin) spin.style.display='none';
    if(drop){
      drop.innerHTML='<div style="padding:12px 14px"><div style="font-size:12px;color:var(--red);margin-bottom:8px">⚠️ No se pudo cargar agencias</div>'+
        '<button onclick="agBuscar(\''+key+'\', document.getElementById(\'shalomAgInput\').value)" '+
        'style="background:rgba(79,142,247,.15);border:1px solid rgba(79,142,247,.3);border-radius:8px;'+
        'color:var(--blue);padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;width:100%;margin-bottom:8px">'+
        '🔄 Reintentar</button>'+
        '<div style="font-size:11px;color:var(--text2);margin-bottom:6px">O escribe la agencia manualmente:</div>'+
        '<input class="fi" style="font-size:13px" placeholder="Ej: Agencia Lima Centro" oninput="agManual(\''+key+'\', this.value)"></div>';
      drop.style.display='block';
    }
  }
}

function agMostrar(key, agencias, aviso){
  const drop = $('shalomDrop');
  if(!drop) return;
  if(!agencias.length){
    drop.innerHTML='<div style="padding:12px 14px;text-align:center">'
      +'<div style="font-size:24px;margin-bottom:8px">🔍</div>'
      +'<div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px">Sin resultados</div>'
      +'<div style="font-size:11px;color:var(--text2);line-height:1.6">Intenta buscar por:<br>'
      +'<b>ciudad</b> · <b>distrito</b> · <b>nombre de agencia</b>, o toca tu zona en el mapa</div>'
      +'</div>';
    drop.style.display='block';
    return;
  }
  // La elegida, SIEMPRE arriba (aunque una búsqueda o un toque cambie el resto).
  const el = _agElegidaObj(key);
  const lista = AgLista.conElegida(agencias, el);
  // Distancias desde el punto de referencia, si lo hay y la sede no la trae.
  if(_agRef){
    lista.forEach(function(ag){
      if(ag._distKm==null){ var c=AgLista.coords(ag); if(c) ag._distKm=_haversineKm(_agRef.la,_agRef.lo,c[0],c[1]); }
    });
  }
  window._agCache[key] = lista;
  const cfg = AGENCY_SOURCES[key] || {};
  const _q = (($('shalomAgInput')||{}).value||'').trim();
  let cab = '';
  if(aviso) cab = '📍 '+esc(aviso);
  else if(!_q && _agRef && _agRef.tipo==='tu') cab = '📍 Sedes más cercanas a ti';
  else if(!_q && _agRef && _agRef.tipo==='punto') cab = '📍 Sedes cerca del punto que tocaste';
  if(!el && !_q) cab = (cab ? cab+' · ' : '') + '👇 Toca tu sede';
  drop.innerHTML = (cab ? '<div class="ag-lista-cab">'+cab+'</div>' : '') + lista.map((ag,i)=>{
    const sel = !!el && AgLista.clave(ag)===_agElegidaK;
    const km  = (_agRef && _agRef.tipo!=='sede') ? AgLista.km(ag._distKm) : '';
    const pie = [esc(ag.departamento||''), ag.ter_id ? 'Agencia #'+esc(ag.ter_id) : '']
      .filter(Boolean).join(' · ');
    return `<div onclick="agSel('${key}', ${i})" class="ag-item${sel?' ag-item-sel':''}" role="button" aria-pressed="${sel}">
      <div class="ag-item-ic" aria-hidden="true">${sel?'✓':'📍'}</div>
      <div style="flex:1;min-width:0">
        <div class="ag-item-t">${esc(AgLista.titulo(ag, cfg.label||''))}</div>
        ${ag.direccion?`<div class="ag-item-d">${esc(ag.direccion)}</div>`:''}
        <div class="ag-item-p">${pie}${km?` <span class="ag-item-km">${km}</span>`:''}${sel?' <span class="ag-chip">Seleccionada</span>':''}</div>
        ${sel && (ag.horario||ag.hora_atencion)?`<div class="ag-item-d">🕐 ${esc(ag.horario||ag.hora_atencion)}</div>`:''}
      </div>
    </div>`;
  }).join('');
  drop.style.display='block';
  agMapaPintar(key, lista, {});
}

/* ─── EL MAPA DE SEDES ──────────────────────────────────────────────────
   ⚠️ EL MAPA NO ES OTRA FORMA DE ELEGIR: tocar un pin pasa por la MISMA
   puerta que tocar una fila (_agElegir). Pines ROJOS dibujados aquí (sin
   descargar imágenes); tu ubicación es un PUNTO azul que no se puede tocar.

   ⚠️ Y LA LISTA MANDA. El mapa solo aparece si Leaflet carga y hay
   coordenadas. Las sedes sin coordenadas (19 en Shalom) salen en la lista y
   se eligen igual. Si el CDN está caído, el formulario funciona igual.

   En la PC se arrastra con el mouse (dragging) y la rueda hace zoom SOLO
   tras hacer clic dentro del mapa: si no, la rueda atraparía la página.

   No cuesta ni una llamada: `latitud` y `longitud` ya venían en el
   catálogo local, cacheado con su versión. */
var _mapa=null, _mapaMarcas=[], _mapaCarga=null, _miUbic=null, _miPunto=null, _puntoRef=null, _mapaKey='';

/** Carga Leaflet UNA vez y solo cuando hace falta (perezoso: quien pide a
    domicilio no llega a este paso). */
function agMapaCargar(){
  if(_mapaCarga) return _mapaCarga;
  _mapaCarga = new Promise(function(res){
    if(window.L) return res(true);
    try{
      var css=document.createElement('link');
      css.rel='stylesheet';
      css.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css';
      document.head.appendChild(css);
      var js=document.createElement('script');
      js.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';
      js.onload=function(){ res(!!window.L); };
      js.onerror=function(){ res(false); };   // sin mapa, con lista
      document.head.appendChild(js);
    }catch(e){ res(false); }
  });
  return _mapaCarga;
}

function _agCoords(ag){
  var la=parseFloat(ag&&ag.latitud), lo=parseFloat(ag&&ag.longitud);
  if(!isFinite(la)||!isFinite(lo)) return null;
  // Fuera de Perú es un dato malo, no una sede lejana: un cero o un signo
  // cambiado mandaría el mapa al Atlántico y escondería todo lo demás.
  if(la<-19||la>0||lo<-82||lo>-68) return null;
  return [la,lo];
}

/* El pin rojo (SVG en línea). `grande` = la elegida. */
function _agIcono(grande){
  var w=grande?36:26, h=grande?48:35;
  return L.divIcon({className:'ag-pin', iconSize:[w,h], iconAnchor:[w/2,h], popupAnchor:[0,-h+4],
    html:'<svg width="'+w+'" height="'+h+'" viewBox="0 0 26 35" aria-hidden="true"><path d="M13 0C5.8 0 0 5.7 0 12.8 0 22.4 13 35 13 35s13-12.6 13-22.2C26 5.7 20.2 0 13 0z" fill="'+(grande?'#b91c1c':'#e11d2e')+'" stroke="#fff" stroke-width="1.6"/><circle cx="13" cy="12.6" r="4.6" fill="#fff"/></svg>'});
}

/* opc.todas: el mapa de bienvenida con TODAS las sedes (para tocar tu zona);
   sin él, las de la lista que se está viendo. */
async function agMapaPintar(key, agencias, opc){
  opc=opc||{};
  var wrap=$('shalomMapaWrap');
  if(!wrap) return;
  var conGeo=[];
  (agencias||[]).forEach(function(ag,i){
    var c=_agCoords(ag);
    if(c) conGeo.push({i:i, c:c, ag:ag});
  });
  if(!conGeo.length){ wrap.style.display='none'; return; }
  var ok=await agMapaCargar();
  if(!ok || !window.L){ wrap.style.display='none'; return; }
  wrap.style.display='block';
  var ay=$('agMapaAyuda'); if(ay) ay.style.display='block';
  try{
    if(!_mapa || !document.getElementById('shalomMapa').contains(_mapa.getContainer())){
      if(_mapa){ try{ _mapa.remove(); }catch(e){} }
      _mapa=L.map('shalomMapa',{
        dragging:true,              // también con el mouse en la PC
        scrollWheelZoom:false,      // la rueda NO atrapa la página…
        tap:true, attributionControl:true
      });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {maxZoom:18, attribution:'© OpenStreetMap'}).addTo(_mapa);
      // …salvo después de hacer clic en el mapa; al salir se apaga.
      _mapa.on('click focus', function(){ try{ _mapa.scrollWheelZoom.enable(); }catch(e){} });
      _mapa.on('mouseout blur', function(){ try{ _mapa.scrollWheelZoom.disable(); }catch(e){} });
      // Tocar un punto VACÍO: las sedes cerca de ese punto.
      _mapa.on('click', function(e){ if(e && e.latlng) agPuntoMapa(_mapaKey, e.latlng.lat, e.latlng.lng); });
    }
    _mapaKey=key;
    _mapaMarcas.forEach(function(x){ try{ _mapa.removeLayer(x.m); }catch(e){} });
    _mapaMarcas=[];
    conGeo.forEach(function(g){
      var sel = AgLista.clave(g.ag)===_agElegidaK;
      var m=L.marker(g.c, {icon:_agIcono(sel), zIndexOffset: sel?1000:0, bubblingMouseEvents:false}).addTo(_mapa);
      m.bindPopup('<b>'+esc(AgLista.titulo(g.ag, (AGENCY_SOURCES[key]||{}).label||''))+'</b><br>'+esc(g.ag.direccion||''));
      // LA MISMA PUERTA que la lista: la sede, no un índice que cambia.
      m.on('click', function(){ _agElegir(key, g.ag); });
      _mapaMarcas.push({m:m, i:g.i, k:AgLista.clave(g.ag)});
    });
    /* ★ DÓNDE ESTÁS TÚ — un PUNTO azul, no un pin: no se elige ni se toca. */
    if(_miPunto){ try{ _mapa.removeLayer(_miPunto); }catch(e){} _miPunto=null; }
    if(_miUbic){
      _miPunto=L.circleMarker([_miUbic.la,_miUbic.lo],{
        radius:7, color:'#fff', weight:2.5, fillColor:'#2d7ff9', fillOpacity:1,
        interactive:false
      }).addTo(_mapa);
    }
    // El punto que tocaste, para que se vea desde dónde se midió.
    if(_puntoRef){ try{ _mapa.removeLayer(_puntoRef); }catch(e){} _puntoRef=null; }
    if(_agRef && _agRef.tipo==='punto'){
      _puntoRef=L.circleMarker([_agRef.la,_agRef.lo],{radius:6, color:'#2d7ff9', weight:2,
        fillColor:'#fff', fillOpacity:1, interactive:false}).addTo(_mapa);
    }
    var elegida=_mapaMarcas.find(function(x){ return x.k===_agElegidaK; });
    if(elegida){
      _mapa.setView(elegida.m.getLatLng(), Math.max(_mapa.getZoom()||0, 14), {animate:true});
    } else if(opc.todas){
      _mapa.fitBounds(conGeo.map(function(g){ return g.c; }), {padding:[16,16], maxZoom:15});
    } else {
      // Las 8 más cercanas encuadradas (no las 20: quedarían muy chiquitas).
      var pts=conGeo.slice(0,8).map(function(g){ return g.c; });
      if(_agRef && _agRef.tipo!=='sede') pts.push([_agRef.la,_agRef.lo]);
      _mapa.fitBounds(pts, {padding:[24,24], maxZoom:15});
    }
    // El contenedor nace oculto y Leaflet mide mal lo que no se ve.
    setTimeout(function(){ try{ _mapa.invalidateSize(); }catch(e){} }, 60);
  }catch(e){
    // Un mapa que revienta no puede llevarse por delante el formulario.
    wrap.style.display='none';
  }
}

/* Señalar la elegida en el mapa (lo hace agMapaPintar al repintar la lista:
   pin grande y delante). Se conservan estas dos por compatibilidad. */
function agMapaMarcar(i){
  if(!_mapa || !_mapaMarcas.length) return;
  try{
    var x=_mapaMarcas.find(function(m){ return m.i===i; });
    if(x) _mapa.setView(x.m.getLatLng(), Math.max(_mapa.getZoom()||0, 14), {animate:true});
  }catch(e){/* el mapa nunca puede romper la eleccion */}
}
function agMapaDesmarcar(){
  try{ if(_mapa) _mapa.closePopup(); }catch(e){}
}

/* Tocar una fila de la lista. */
function agSel(key, i){
  const ag = (window._agCache[key]||[])[i];
  if(ag) _agElegir(key, ag);
}

/* ★ LA ÚNICA PUERTA PARA ELEGIR (fila o pin). Guarda lo que el pedido
   necesita —igual que siempre— y repinta la lista con la elegida ARRIBA y
   marcada. No avanza de paso: el cliente lo ve y pulsa «Continuar» (en un
   mapa es fácil tocar un pin por error). */
function _agElegir(key, ag){
  if(!ag) return;
  const nombre = ag.lugar_over||ag.nombre||'';
  const dir    = ag.direccion||'';
  const geo    = [ag.zona||ag.distrito, ag.provincia, ag.departamento].filter(Boolean).join(', ');
  agState.addr = [nombre, dir, geo].filter(Boolean).join(' - ');
  window._agSel[key] = {
    nombre, direccion: dir,
    distrito: ag.zona||ag.distrito||'',
    provincia: ag.provincia||'',
    departamento: ag.departamento||'',
    telefono: ag.telefono||'',
    id: ag.ter_id||''
  };
  /* ★ LA AGENCIA IDENTIFICADA: sin el ter_id, registrar el envío en Shalom
     es imposible. Ver functions/agencias.js. */
  window._agIdent = (window.Agencias ? Agencias.elegida(ag, key) : null);
  window._agIdentTxt = agState.addr;
  _agElegidaK = AgLista.clave(ag);
  // La lista que se ve: la actual si ya la incluía; si no (pin del mapa de
  // bienvenida), las cercanas a ESA sede. En las dos, la elegida arriba.
  let lista = (window._agCache[key]||[]);
  if(!lista.some(function(x){ return AgLista.clave(x)===_agElegidaK; })){
    const c = AgLista.coords(ag);
    if(c && !_agRef) _agRef = {la:c[0], lo:c[1], tipo:'sede'};
    lista = c ? AgLista.cercanas(_agTodas(key), (_agRef||{}).la||c[0], (_agRef||{}).lo||c[1], _AG_CERCA_N) : [ag];
  }
  agMostrar(key, lista, '');
  const drop = $('shalomDrop'); if(drop){ try{ drop.scrollTop = 0; }catch(e){} }
  const txt = $('shalomSelTxt');
  if(txt) txt.textContent = [nombre, dir, geo].filter(Boolean).join(' · ');
  $('err_agency')&&$('err_agency').classList.remove('show');
}

function agManual(key, val){

function agReset(key){
  agState.addr = '';

  const inp = $('shalomAgInput');

  // Vaciar el TEXTO, no solo ocultarlo: la etiqueta viva lo lee con textContent,
  // que devuelve el texto aunque el elemento este oculto. Sin esto, al pulsar la
  // ✕ la etiqueta seguia mostrando la sede borrada y parecia un fallo de la app.

}

/* ─── ASISTENTE PASO A PASO (solo presentación) ──────────────────────
   El formulario se muestra por pasos para que sea más rápido de llenar y
   nada tape a nada. NO cambia la validación ni el envío: submitOrder()
   sigue siendo el guardián final. Cada "Continuar" reusa las MISMAS reglas
   para no dejar avanzar con errores. Todo va en try/catch: si algo fallara,
   el formulario sigue funcionando. */
var _wzStep=1;
function _wzInjectCss(){
  if(document.getElementById('wzCss')) return;
  var s=document.createElement('style'); s.id='wzCss';
  s.textContent=''
   // ESPACIO ENTRE LA BARRA DE PROGRESO Y EL PASO. Su UNICO dueño es
   // .wz-progress: es el bloque cuyo trabajo es encabezar el paso, asi que le
   // toca declarar cuanto aire deja debajo. Antes tambien lo declaraba
   // .agc-box (margin-top:14px) y los dos margenes se FUNDIAN —ganaba el
   // mayor—, asi que tocar uno solo no hacia nada. Ese margin-top se quito por
   // redundante: .agc-box es siempre el primer hijo de su paso.
   // El colapso de margenes se DEJA a proposito: hace que el hueco sea el mayor
   // de lo que pida cada lado, asi un bloque que necesite mas aire (Retiro en
   // tienda pide 18px) lo conserva sin tener que listarlo aqui.
   +'.wz-wrap{padding-bottom:12px}'
   +'.wz-progress{margin:2px 0 8px}'
   +'.wz-ptxt{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#8b949e;margin-bottom:6px;font-weight:700}'
   +'.wz-pbar{height:6px;background:#1c2333;border-radius:99px;overflow:hidden}'
   +'.wz-pbar i{display:block;height:100%;background:linear-gradient(90deg,#12a5b4,#5b9bff);border-radius:99px;transition:width .35s ease}'
   +'.wz-step[hidden]{display:none!important}'
   +'.wz-step{animation:wzIn .28s ease}'
   +'@keyframes wzIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}'
   +'.wz-nav{display:flex;gap:10px;margin-top:14px}'
   +'.wz-nav .wz-back{flex:0 0 auto;background:#1c2333;border:1px solid #30363d;color:#8b949e;border-radius:12px;padding:0 16px;min-height:44px;font-size:14px;cursor:pointer;font-family:inherit}'
   +'.wz-nav .btn-main{flex:1;margin-top:0!important}';
  document.head.appendChild(s);
}
function _wzNeedDest(){ return selCourierType!=='retiro'; }
function wzSeq(){ return _wzNeedDest()?[1,2,3,4]:[1,2,4]; }
function _wzErr(fid,eid,bad){
  var fe=$(fid),ee=$(eid);
  if(bad){ fe&&fe.classList.add('err'); ee&&ee.classList.add('show'); }
  else   { fe&&fe.classList.remove('err'); ee&&ee.classList.remove('show'); }
  return bad;
}
// Valida SOLO los campos del paso, con las mismas reglas que submitOrder.
function wzValidate(step){
  var ok=true;
  /* ⚠️ EL ORDEN DE ESTOS BLOQUES SIGUE AL DE LA PANTALLA, SIEMPRE.
     El 15/10/2026 el courier paso a ser el paso 1 y los datos el 2, y estos
     dos cuerpos se intercambiaron con ellos. Las reglas no cambiaron ni una
     coma: lo unico que se movio es a que numero responden.
     Si un dia vuelven a moverse los pasos y esto no se mueve, el asistente
     validaria la pantalla equivocada y dejaria pasar un formulario vacio
     sin decir nada. Hay una prueba que compara los dos ordenes. */
  if(step===1){
    if(!selCourierName){ $('err_courier')&&$('err_courier').classList.add('show'); ok=false; }
    else { $('err_courier')&&$('err_courier').classList.remove('show'); }
  } else if(step===2){
    /* Se valida en el MISMO orden en que se ve. No cambia el resultado
       —`_wzErr` marca todos los campos malos a la vez, no se para en el
       primero— pero leer la validación en otro orden que el formulario es
       cómo se olvida un campo el día que se añade uno. */
    // DNI OBLIGATORIO (8 dígitos) para todos — coincide con el "*" del campo.
    var dni1=($('f_dni')||{value:''}).value.trim();
    if(_wzErr('f_dni','err_dni', !/^\d{8}$/.test(dni1))) ok=false;
    var name=($('f_name')||{value:''}).value.trim();
    var phone=($('f_phone')||{value:''}).value.trim();
    if(_wzErr('f_name','err_name',!name)) ok=false;
    if(_wzErr('f_phone','err_phone',!/^\d{9}$/.test(phone))) ok=false;
    var extraF=((CFG&&CFG.extraFields)||[]).filter(function(f){return f&&f.visible!==false;});
    extraF.forEach(function(f){
      var fname=typeof f==='string'?f:(f.name||''); var isReq=typeof f==='object'&&!!f.required;
      if(!isReq) return;
      var el=$('ex_'+fname.replace(/\W/g,'_')), er=$('exerr_'+fname.replace(/\W/g,'_'));
      if(el&&!el.value.trim()){ el.classList.add('err'); er&&er.classList.add('show'); ok=false; }
      else if(el){ el.classList.remove('err'); er&&er.classList.remove('show'); }
    });
  } else if(step===3){
    if(selCourierType==='agencia'){
      var man=$('agcManualInput');
      if(man){ if(!man.value.trim()){ $('err_agency_manual')&&$('err_agency_manual').classList.add('show'); ok=false; } else { $('err_agency_manual')&&$('err_agency_manual').classList.remove('show'); } }
      else if(!agState.addr){ $('err_agency')&&$('err_agency').classList.add('show'); ok=false; }
      else { $('err_agency')&&$('err_agency').classList.remove('show'); }
    } else if(selCourierType==='encomienda'){
      var ci=($('f_ciudad')||{value:''}).value.trim();
      if(_wzErr('f_ciudad','err_ciudad',!ci)) ok=false;
    } else if(selCourierType==='delivery'){
      var addr=getDeliveryAddr();   // misma fuente que submitOrder y la etiqueta
      if(!addr){ $('err_deliveryAddr')&&$('err_deliveryAddr').classList.add('show'); ok=false; }
      else { $('err_deliveryAddr')&&$('err_deliveryAddr').classList.remove('show'); }
    }
  }
  return ok;
}
function wzProgress(){
  var box=$('wzProgress'); if(!box) return;
  var seq=wzSeq(); var idx=seq.indexOf(_wzStep); if(idx<0) idx=0;
  var pct=Math.round(((idx+1)/seq.length)*100);
  box.innerHTML='<div class="wz-ptxt">Paso '+(idx+1)+' de '+seq.length+'</div>'
    +'<div class="wz-pbar"><i style="width:'+pct+'%"></i></div>';
}
// Enfoca el primer campo de texto VISIBLE del paso activo (si lo hay) para que
// salga el teclado y parpadee el cursor. DEBE llamarse dentro del gesto del
// usuario (toque) para que iOS abra el teclado. Devuelve true si enfocó algo.
// En pasos sin campo de texto (courier, fecha, delivery antes de elegir modo,
// retiro) no enfoca nada → el paso sube al inicio como antes.
function wzFocusFirst(){
  try{
    var step=document.querySelector('.wz-step[data-step="'+_wzStep+'"]');
    if(!step) return false;
    // Campos marcados a propósito con data-wz-focus (buscador Shalom, agencia
    // manual OLVA, ciudad de Otras Agencias). Evita enfocar por error un campo
    // secundario (ej. DNI en la cascada, o Referencia en delivery) o un select.
    var cands=step.querySelectorAll('[data-wz-focus]'), el=null;
    for(var i=0;i<cands.length;i++){ var c=cands[i]; if(c.offsetParent!==null && !c.disabled && !c.readOnly){ el=c; break; } }
    if(!el) return false;
    el.focus(); // dentro del gesto → abre el teclado; el navegador ya sube el campo
    // Red de seguridad: recentra el campo sobre el teclado tras su animación,
    // por si algún navegador no lo subió solo (que no lo tape el teclado).
    setTimeout(function(){ try{ el.scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){} }, 300);
    return true;
  }catch(e){ return false; }
}
function wzShow(step, doFocus){
  _wzStep=step;
  var steps=document.querySelectorAll('.wz-step');
  for(var i=0;i<steps.length;i++){ steps[i].hidden=(+steps[i].getAttribute('data-step')!==step); }
  wzProgress();
  var focused = doFocus ? wzFocusFirst() : false;
  if(!focused){
    try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ try{ window.scrollTo(0,0); }catch(_){} }
  }
}
function wzNext(){
  if(!wzValidate(_wzStep)) return;   // muestra los errores y no avanza
  var seq=wzSeq(); var idx=seq.indexOf(_wzStep);
  // doFocus=true: enfoca el primer campo del paso siguiente. wzNext se llama
  // dentro del gesto (botón "Continuar" o toque del courier), así el teclado
  // abre también en iPhone.
  if(idx>=0&&idx<seq.length-1) wzShow(seq[idx+1], true);
}
function wzBack(){
  var seq=wzSeq(); var idx=seq.indexOf(_wzStep);
  if(idx>0) wzShow(seq[idx-1]);
}
function wzInit(){
  try{
    if(!$('wzProgress')) return;         // el form no está en modo asistente
    _wzInjectCss();
    _wzStep=1; window._selCourierType=''; window._ttFrozen=false;
    // Enter avanza en los campos de texto del paso 1 (avance "mixto")
    ['f_name','f_phone','f_dni'].forEach(function(id){
      var el=$(id); if(el) el.addEventListener('keydown',function(ev){ if(ev.key==='Enter'){ ev.preventDefault(); wzNext(); } });
    });
    // Auto-avance al elegir courier (elección clara → siguiente paso). INMEDIATO
    // y dentro del gesto (pickCourier→dispatch change): sin setTimeout, para que
    // al enfocar el primer campo del paso 3 el teclado abra también en iPhone.
    // onCourierChange (onchange inline) ya corrió antes y dejó visible el bloque
    // correcto (agencia/otras/delivery), así que wzFocusFirst enfoca el campo justo.
    var cs=$('f_courier');
    if(cs) cs.addEventListener('change',function(){
      // El courier es el paso 1 desde el 15/10/2026 (antes el 2).
      if(_wzStep!==1||!this.value) return;
      if(selCourierName) wzNext();
    });
    wzShow(1);
  }catch(e){ /* nunca romper el formulario */ }
}
